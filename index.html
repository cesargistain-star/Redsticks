function impNorm(s){
  s=String(s==null?'':s).toUpperCase();
  if(s.normalize) s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  return s.replace(/[^A-Z0-9]/g,'');
}
function impEsc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function impXmlText(s){
  return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,'\'')
    .replace(/&#x([0-9a-fA-F]+);/g,function(m,h){return String.fromCharCode(parseInt(h,16));})
    .replace(/&#(\d+);/g,function(m,d){return String.fromCharCode(parseInt(d,10));})
    .replace(/&amp;/g,'&');
}

// ── ZIP (.xlsx) sin dependencias ──
function impInflate(method,data){
  if(method===0) return Promise.resolve(new TextDecoder().decode(data));
  if(method!==8) return Promise.reject(new Error('Compresion del .xlsx no soportada'));
  if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('Este navegador no puede abrir .xlsx. Actualiza iPadOS o guarda la hoja como CSV.'));
  var stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).text();
}
function impUnzip(buf){
  var u8=new Uint8Array(buf), dv=new DataView(buf), eocd=-1;
  for(var i=u8.length-22;i>=Math.max(0,u8.length-65558);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) return Promise.reject(new Error('El archivo no es un .xlsx valido'));
  var n=dv.getUint16(eocd+10,true), off=dv.getUint32(eocd+16,true), files={}, jobs=[], td=new TextDecoder();
  function keep(nm){ return function(t){ files[nm]=t; }; }
  for(var k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    var method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true);
    var nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true);
    var loff=dv.getUint32(off+42,true);
    var name=td.decode(u8.subarray(off+46,off+46+nlen));
    off+=46+nlen+elen+clen;
    if(!/^xl\/(workbook\.xml|sharedStrings\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^\/]+\.xml)$/.test(name)) continue;
    var lnl=dv.getUint16(loff+26,true), lel=dv.getUint16(loff+28,true), ds=loff+30+lnl+lel;
    jobs.push(impInflate(method,u8.subarray(ds,ds+csize)).then(keep(name)));
  }
  return Promise.all(jobs).then(function(){ return files; });
}
function impSST(xml){
  var out=[]; if(!xml) return out;
  var re=/<si>([\s\S]*?)<\/si>/g, m;
  while((m=re.exec(xml))){
    var t='', r2=/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g, mm;
    while((mm=r2.exec(m[1]))) t+=mm[1];
    out.push(impXmlText(t));
  }
  return out;
}
function impColIdx(ref){
  var c=ref.replace(/[0-9]/g,''), n=0;
  for(var i=0;i<c.length;i++) n=n*26+(c.charCodeAt(i)-64);
  return n-1;
}
function impSheetGrid(xml,sst){
  var grid=[], re=/<c\s([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, m;
  while((m=re.exec(xml))){
    var at=m[1], rm=/\br="([A-Z]+)(\d+)"/.exec(at); if(!rm) continue;
    var tm=/\bt="(\w+)"/.exec(at), t=tm?tm[1]:'n', inner=m[2]||'', v=null;
    if(t==='inlineStr'){
      var it=/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/.exec(inner); v=it?impXmlText(it[1]):'';
    } else {
      var vm=/<v>([\s\S]*?)<\/v>/.exec(inner);
      if(vm){
        v=vm[1];
        if(t==='s') v=sst[parseInt(v,10)];
        else if(t==='str'||t==='e') v=impXmlText(v);
        else if(t==='b') v=(v==='1')?1:0;
        else v=parseFloat(v);
      }
    }
    if(v===null||v===undefined||v==='') continue;
    var r=parseInt(rm[2],10)-1, c=impColIdx(rm[1]);
    if(!grid[r]) grid[r]=[];
    grid[r][c]=v;
  }
  var mr=/<mergeCell\s+ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/g, mc;
  while((mc=mr.exec(xml))){
    var r0=parseInt(mc[2],10)-1, r1=parseInt(mc[4],10)-1, c0=impColIdx(mc[1]), c1=impColIdx(mc[3]);
    var val=grid[r0]?grid[r0][c0]:null; if(val===null||val===undefined) continue;
    for(var rr=r0;rr<=r1;rr++){
      if(!grid[rr]) grid[rr]=[];
      for(var cc=c0;cc<=c1;cc++) if(grid[rr][cc]===undefined) grid[rr][cc]=val;
    }
  }
  return grid;
}
function impSheets(files){
  var wb=files['xl/workbook.xml']||'', rels=files['xl/_rels/workbook.xml.rels']||'', out=[];
  var re=/<sheet\b[^>]*?r:id="([^"]+)"/g, m;
  while((m=re.exec(wb))){
    var rr=new RegExp('<Relationship\\b[^>]*\\bId="'+m[1]+'"[^>]*>').exec(rels);
    if(!rr) continue;
    var tg=/Target="([^"]+)"/.exec(rr[0]); if(!tg) continue;
    var p='xl/'+tg[1].replace(/^\/?xl\//,'').replace(/^\//,'');
    if(files[p]) out.push(files[p]);
  }
  if(!out.length) for(var k in files) if(/^xl\/worksheets\//.test(k)) out.push(files[k]);
  return out;
}
function impCSVGrid(txt){
  txt=txt.replace(/^﻿/,'');
  var first=txt.split(/\r?\n/)[0]||'';
  var sep=(first.split(';').length>first.split(',').length)?';':(first.indexOf('\t')>=0?'\t':',');
  var grid=[], row=[], cur='', q=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charAt(i);
    if(q){
      if(ch==='"'){ if(txt.charAt(i+1)==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    } else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&txt.charAt(i+1)==='\n') i++;
      row.push(cur); grid.push(row); row=[]; cur='';
    } else cur+=ch;
  }
  if(cur!==''||row.length){ row.push(cur); grid.push(row); }
  for(var r=0;r<grid.length;r++) for(var c=0;c<grid[r].length;c++){
    var v=grid[r][c].trim();
    if(v==='') grid[r][c]=undefined;
    else if(/^-?\d+([.,]\d+)?$/.test(v)) grid[r][c]=parseFloat(v.replace(',','.'));
    else grid[r][c]=v;
  }
  // CSV pierde las celdas combinadas: rellenar cabeceras hacia la derecha se hace en impAnalyze
  return grid;
}

// ── Lectura de la estructura ──
function impGrpPos(label){
  var n=impNorm(label);
  if(/PORTER|GOALK|^GK/.test(n)) return 'GK';
  if(/CENTRAL|LATERAL|DEFENS|CARRIL|LIBERO|DEF/.test(n)) return 'DEF';
  if(/MEDIO|VOLANT|INTERIOR|MEDIOC|MID/.test(n)) return 'MID';
  if(/DELANT|ATAC|ATAQ|PUNTA|EXTREM|FWD|FORW/.test(n)) return 'FWD';
  return null;
}
function impOn(v){
  if(v===1||v===true) return true;
  if(typeof v==='number') return v>0;
  var n=impNorm(v); return n==='1'||n==='X'||n==='SI';
}
function impNum(v){
  if(typeof v==='number') return v;
  if(typeof v==='string'&&/^\s*\d+\s*$/.test(v)) return parseInt(v,10);
  return NaN;
}
function impRuns(grid){
  // columnas de minutos: series descendentes N, N-1 ... 1 (N = 8..20)
  var R=grid.length, maxC=0, runs=[];
  for(var r=0;r<R;r++) if(grid[r]&&grid[r].length>maxC) maxC=grid[r].length;
  for(var c=0;c<maxC;c++){
    var r=0;
    while(r<R){
      var v=impNum((grid[r]||[])[c]);
      if(v>=8&&v<=20&&Math.floor(v)===v){
        var k=r+1, exp=v-1;
        while(k<R&&exp>=0&&impNum((grid[k]||[])[c])===exp){k++;exp--;}
        var len=k-r;
        if(len>=5&&exp<=0){ runs.push({c:c,r0:r,r1:k-1,start:v}); r=k; continue; }
      }
      r++;
    }
  }
  return runs;
}
function impTextCount(row,cols){
  var n=0,kw=0;
  for(var i=0;i<cols.length;i++){
    var v=row?row[cols[i]]:undefined;
    if(typeof v==='string'&&v.trim()&&!/^\d+$/.test(v.trim())){ n++; if(impGrpPos(v)&&/CENTRAL|LATERAL|MEDIO|DELANT|DEFENS|ATAC|PORTER|VOLANT|INTERIOR|EXTREM|PIVOT|OFENSIV|^DEL$/.test(impNorm(v))) kw++; }
  }
  return {n:n,kw:kw};
}
function impAnalyze(grid){
  var R=grid.length, runs=impRuns(grid);
  if(!runs.length) throw new Error('No encuentro columnas de minutos (15, 14 ... 1).');
  // agrupar series por fila de inicio -> bloques
  var byRow={}, starts=[];
  for(var i=0;i<runs.length;i++){ var k=runs[i].r0; if(!byRow[k]){byRow[k]=[];starts.push(k);} byRow[k].push(runs[i]); }
  starts.sort(function(a,b){return a-b;});
  var blocks=[], order=[], info={}, prevDef=null, tac={}, firstNamesRow=-1, firstLeft=-1;
  for(var s=0;s<starts.length;s++){
    var rs=byRow[starts[s]].sort(function(a,b){return a.c-b.c;});
    var r0=rs[0].r0, r1=rs[0].r1, qlen=rs[0].start;
    // columnas de jugador: entre columnas de minutos consecutivas
    var segs=[];
    for(var j=0;j<rs.length;j++){
      var a=rs[j].c+1, b=(j+1<rs.length)?rs[j+1].c-1:-1;
      if(b<0){ // sin columna de cierre: hasta el primer hueco
        b=a; while(true){ var any=false; for(var rr=Math.max(0,r0-4);rr<=r1;rr++){ var vv=(grid[rr]||[])[b]; if(vv!==undefined&&vv!==null&&String(vv).trim()!==''){any=true;break;} } if(!any) break; b++; }
        b--;
      }
      for(var cc=a;cc<=b;cc++) segs.push(cc);
    }
    if(!segs.length) continue;
    // fila de nombres: la mas cercana por encima con texto en la mayoria de columnas y que no sea de lineas
    var nR=-1, bestK=-1;
    for(var rr=r0-1;rr>=Math.max(0,r0-4);rr--){
      var tc=impTextCount(grid[rr],segs);
      if(!(tc.n>=Math.max(3,Math.ceil(segs.length*0.5))&&tc.kw<tc.n*0.5)) continue;
      if(!order.length){nR=rr;break;}
      var known=0; for(var q0=0;q0<segs.length;q0++){ var vq=(grid[rr]||[])[segs[q0]]; if(typeof vq==='string'&&info[vq.trim().toUpperCase()]) known++; }
      if(known>bestK){bestK=known;nR=rr;}
    }
    if(order.length&&nR>=0&&bestK<3) nR=-1;
    var def;
    if(nR>=0){
      var cols=[];
      for(var i2=0;i2<segs.length;i2++){
        var nv=grid[nR][segs[i2]]; if(typeof nv!=='string'||!nv.trim()||/^\d+$/.test(nv.trim())) continue;
        cols.push({c:segs[i2],name:nv.trim().toUpperCase()});
      }
      // fila de lineas encima de los nombres
      var gR=-1;
      for(var rr2=nR-1;rr2>=Math.max(0,nR-3);rr2--){ var tg=impTextCount(grid[rr2],segs); if(tg.kw>0&&tg.kw>=tg.n*0.5){gR=rr2;break;} }
      var last=null;
      for(var k2=0;k2<cols.length;k2++){
        var g=gR>=0?(grid[gR]||[])[cols[k2].c]:null;
        if(typeof g==='string'&&g.trim()) last=g.trim().toUpperCase();
        cols[k2].grp=last||'CAMPO'; cols[k2].pos=impGrpPos(cols[k2].grp);
      }
      // roles tacticos (filas DEF / AT encima)
      var top=gR>=0?gR:nR, lc=rs[0].c;
      for(var rr3=Math.max(0,top-4);rr3<top;rr3++){
        var row=grid[rr3]||[], lab=null;
        for(var c3=0;c3<=lc;c3++) if(typeof row[c3]==='string'){lab=impNorm(row[c3]);}
        var kind=(lab==='DEF'||lab==='DEFENSA')?'def':(lab==='AT'||lab==='ATAQUE'||lab==='ATQ')?'at':null;
        if(!kind) continue;
        for(var k3=0;k3<cols.length;k3++){
          var tv=row[cols[k3].c];
          if(tv!==undefined&&tv!==null&&String(tv).trim()){
            if(!tac[cols[k3].name]) tac[cols[k3].name]={};
            tac[cols[k3].name][kind]=String(tv).trim().toUpperCase().replace(/CENTTRAL/g,'CENTRAL');
          }
        }
      }
      def={cols:cols};
      if(firstNamesRow<0){firstNamesRow=gR>=0?gR:nR; firstLeft=lc;}
    } else if(prevDef){
      def=prevDef;
    } else continue;
    prevDef=def;
    var useCols=def.cols.filter(function(x){return x.pos!=='GK';});
    for(var k4=0;k4<useCols.length;k4++){ var nm=useCols[k4].name; if(!info[nm]){info[nm]=useCols[k4]; order.push(nm);} }
    var blk=[];
    for(var r=r0;r<=r1;r++){
      var rowv=grid[r]||[], mn=impNum(rowv[rs[0].c]), on=[];
      for(var k5=0;k5<useCols.length;k5++) if(impOn(rowv[useCols[k5].c])&&on.indexOf(useCols[k5].name)<0) on.push(useCols[k5].name);
      blk.push({min:mn,on:on,row:r+1});
    }
    blk.qlen=qlen;
    blocks.push(blk);
  }
  if(!blocks.length) throw new Error('No encuentro la fila con los nombres de los jugadores.');
  var cols=order.map(function(n){return info[n];});
  if(cols.length<8) throw new Error('Solo encuentro '+cols.length+' jugadores.');
  // titulo y rival
  var title='', topR=firstNamesRow>0?firstNamesRow:R;
  for(var r6=0;r6<topR&&!title;r6++){
    var row6=grid[r6]||[];
    for(var c6=0;c6<row6.length;c6++){ if(typeof row6[c6]==='string'&&/\bVS\.?\b|\s-\s/i.test(row6[c6])&&row6[c6].length>8){title=row6[c6].trim();break;} }
  }
  if(!title){ var r00=grid[0]||[]; for(var c7=0;c7<r00.length;c7++) if(typeof r00[c7]==='string'){title=r00[c7].trim();break;} }
  var qlen=blocks[0].qlen;
  var errors=[], warns=[];
  if(blocks.length===3||blocks.length>4) errors.push('Encuentro '+blocks.length+' bloques de minutos. Deben ser 1, 2 (Q1=Q3 y Q2=Q4) o 4.');
  if(qlen!==15) warns.push('Cuartos de '+qlen+' minutos.');
  for(var b=0;b<blocks.length;b++){
    var off=blocks[b].qlen-blocks[b][0].min;
    for(var i3=0;i3<blocks[b].length;i3++) blocks[b][i3].cd=blocks[b][i3].min+off;
  }
  var counts={}, best=0, exp=10;
  for(var b2=0;b2<blocks.length;b2++) for(var i4=0;i4<blocks[b2].length;i4++){ var n=blocks[b2][i4].on.length; counts[n]=(counts[n]||0)+1; }
  for(var kk in counts) if(counts[kk]>best){best=counts[kk];exp=parseInt(kk,10);}
  if(exp!==10) warns.push('La Excel tiene '+exp+' jugadores de campo por minuto (lo normal son 10).');
  for(var b3=0;b3<blocks.length;b3++) for(var i5=0;i5<blocks[b3].length;i5++){
    var rw=blocks[b3][i5];
    if(rw.on.length!==exp) errors.push(impBlkName(b3,blocks.length)+' · minuto '+rw.min+' (fila '+rw.row+'): '+rw.on.length+' en campo en vez de '+exp);
  }
  return {title:title,rival:impRival(title),cols:cols,tac:tac,blocks:blocks,errors:errors,warns:warns,qlen:qlen,exp:exp};
}

function impBlkName(b,nb){
  if(nb===2) return b===0?'Q1/Q3':'Q2/Q4';
  if(nb===1) return 'Q1-Q4';
  return 'Q'+(b+1);
}
function impRival(title){
  if(!title) return null;
  var parts=title.split(/\bvs\.?\b|\bv\b|\s-\s/i);
  for(var i=0;i<parts.length;i++){
    var words=parts[i].trim().split(/\s+/);
    for(var s=0;s<words.length;s++){
      for(var len=Math.min(3,words.length-s);len>=1;len--){
        var key=impNorm(words.slice(s,s+len).join(''));
        if(IMP_SELF.indexOf(key)>=0) { s+=len-1; break; }
        if(IMP_CTRY[key]) return IMP_CTRY[key];
        if(len===1&&key.length===3&&FIH.indexOf(key)>=0) return key;
      }
    }
  }
  return null;
}

// ── Reconocimiento de jugadores ──
function impInitials(name){
  var ws=String(name).split(/[\s,]+/), s='';
  for(var i=0;i<ws.length;i++) if(ws[i]) s+=impNorm(ws[i]).charAt(0);
  return s;
}
function impMatch(name){
  var t=impNorm(name), conv=ROSTER.squad.concat(ROSTER.bench), cands=[], bs=0;
  for(var i=0;i<POOL.length;i++){
    var p=POOL[i]; if(p.pos==='GK') continue;
    var s=0, al=p.alias||[];
    if(impNorm(p.nick)===t) s=10;
    for(var a=0;a<al.length&&s<9;a++) if(impNorm(al[a])===t) s=9;
    if(!s){
      if(impNorm(p.name)===t) s=6;
      var ws=String(p.name).split(/[\s,]+/);
      for(var w=0;w<ws.length;w++) if(ws[w]&&impNorm(ws[w])===t) s=Math.max(s,5);
      if(!s&&t.length>=2&&t.length<=3&&impInitials(p.name)===t) s=3;
      if(!s&&t.length>=3){
        if(impNorm(p.nick).indexOf(t)===0) s=2;
        for(var w=0;w<ws.length;w++) if(ws[w]&&impNorm(ws[w]).indexOf(t)===0) s=Math.max(s,1);
      }
    }
    if(!s) continue;
    if(s>bs){bs=s;cands=[p];} else if(s===bs) cands.push(p);
  }
  if(cands.length>1){
    var cc=cands.filter(function(p){return conv.indexOf(p.id)>=0;});
    if(cc.length===1) cands=cc;
  }
  if(cands.length!==1) return null;
  return {id:cands[0].id, sure:bs>=5};
}

// ── Emparejamientos ──
function impDiff(a,b){ return a.filter(function(x){return b.indexOf(x)<0;}); }
function impSuggest(outs,ins,partner,tac){
  var ch={}, used={};
  function take(o,i){ ch[o]=i; used[i]=1; }
  for(var k=0;k<outs.length;k++){ var pi=partner[outs[k]]; if(pi&&ins.indexOf(pi)>=0&&!used[pi]) take(outs[k],pi); }
  var kinds=['at','def'];
  for(var kd=0;kd<kinds.length;kd++){
    for(var k=0;k<outs.length;k++){
      var o=outs[k]; if(ch[o]) continue;
      var to=(tac[o]||{})[kinds[kd]]; if(!to) continue;
      for(var j=0;j<ins.length;j++){ var i=ins[j]; if(!used[i]&&(tac[i]||{})[kinds[kd]]===to){ take(o,i); break; } }
    }
  }
  for(var k=0;k<outs.length;k++){
    if(ch[outs[k]]) continue;
    for(var j=0;j<ins.length;j++) if(!used[ins[j]]){ take(outs[k],ins[j]); break; }
  }
  return ch;
}
function impBuildTrans(){
  var A=IMP.an, nb=A.blocks.length, grpOf={};
  for(var k=0;k<A.cols.length;k++) grpOf[A.cols[k].name]=A.cols[k].grp;
  IMP.qBlock=nb===4?[0,1,2,3]:nb===2?[0,1,0,1]:[0,0,0,0];
  IMP.trans={}; IMP.order=[]; IMP.qKeys={1:[],2:[],3:[],4:[]};
  var partner={};
  function mk(key,label,cd,from,to){
    if(IMP.trans[key]) return;
    var outs=impDiff(from,to), ins=impDiff(to,from), byG={}, gl=[];
    for(var k=0;k<outs.length;k++){ var g=grpOf[outs[k]]; if(!byG[g]){byG[g]={o:[],i:[]};gl.push(g);} byG[g].o.push(outs[k]); }
    for(var k=0;k<ins.length;k++){ var g=grpOf[ins[k]]; if(!byG[g]){byG[g]={o:[],i:[]};gl.push(g);} byG[g].i.push(ins[k]); }
    var fixed=[], sets=[], mixO=[], mixI=[];
    for(var k=0;k<gl.length;k++){
      var s=byG[gl[k]];
      if(s.o.length!==s.i.length){ mixO=mixO.concat(s.o); mixI=mixI.concat(s.i); continue; }
      if(s.o.length===1) fixed.push([s.o[0],s.i[0],gl[k]]);
      else if(s.o.length>1) sets.push({grp:gl[k],outs:s.o,ins:s.i});
    }
    if(mixO.length) sets.push({grp:'ENTRE LINEAS',outs:mixO,ins:mixI,mix:true});
    for(var k=0;k<fixed.length;k++){ partner[fixed[k][0]]=fixed[k][1]; partner[fixed[k][1]]=fixed[k][0]; }
    for(var k=0;k<sets.length;k++){
      sets[k].ch=impSuggest(sets[k].outs,sets[k].ins,partner,A.tac);
      for(var o in sets[k].ch){ partner[o]=sets[k].ch[o]; partner[sets[k].ch[o]]=o; }
    }
    IMP.trans[key]={key:key,label:label,cd:cd,fixed:fixed,sets:sets,n:outs.length};
    IMP.order.push(key);
  }
  for(var q=1;q<=4;q++){
    var b=IMP.qBlock[q-1], rows=A.blocks[b];
    if(q>1){
      var pb=IMP.qBlock[q-2], prev=A.blocks[pb];
      var key='B'+pb+'>'+b;
      var lab='INICIO '+(nb===2?(b===1?'Q2/Q4':'Q3'):'Q'+q);
      mk(key,lab,0,prev[prev.length-1].on,rows[0].on);
      IMP.qKeys[q].push(key);
    }
    for(var i=1;i<rows.length;i++){
      var key2='I'+b+'_'+i;
      mk(key2,impBlkName(b,nb)+' · '+pad2(rows[i].cd)+':00',rows[i].cd,rows[i-1].on,rows[i].on);
      IMP.qKeys[q].push(key2);
    }
  }
}

// ── UI ──
function impMod(html){
  openMod(html);
  var bx=document.getElementById('mod-box'); if(bx){ bx.style.maxWidth='680px'; bx.scrollTop=0; }
}
function openImport(){
  if(MATCH.phase!=='pre') return toast('El importador solo funciona antes de iniciar el partido (usa NUEVO PARTIDO)','warn');
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv';
  inp.onchange=function(e){
    var file=e.target.files[0]; if(!file) return;
    impMod('<div class="mod-ttl">IMPORTANDO EXCEL…</div><div style="font-size:12px;color:var(--t2)">'+impEsc(file.name)+'</div>');
    var isCSV=/\.csv$/i.test(file.name);
    var rd=new FileReader();
    rd.onload=function(ev){
      var p;
      if(isCSV) p=Promise.resolve([impCSVGrid(ev.target.result)]);
      else p=impUnzip(ev.target.result).then(function(files){
        var sst=impSST(files['xl/sharedStrings.xml']), sh=impSheets(files), gs=[];
        for(var i=0;i<sh.length;i++) gs.push(impSheetGrid(sh[i],sst));
        return gs;
      });
      p.then(function(grids){
        var an=null, err=null;
        for(var i=0;i<grids.length&&!an;i++){ try{ an=impAnalyze(grids[i]); }catch(x){ if(!err) err=x; } }
        if(!an) throw err||new Error('No encuentro una hoja de cambios en el archivo');
        impStart(an,file.name);
      }).catch(function(x){
        impMod('<div class="mod-ttl" style="color:var(--r-ink)">NO SE PUDO IMPORTAR</div>'+
          '<div style="font-size:12px;color:var(--t);margin-bottom:6px">'+impEsc(x&&x.message?x.message:String(x))+'</div>'+
          '<div class="mod-acts"><button class="btn-n" style="flex:1" onclick="closeMod()">CERRAR</button></div>');
      });
    };
    if(isCSV) rd.readAsText(file); else rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function impStart(an,fname){
  if(an.qlen&&an.qlen!==15) an.errors.unshift('Cuartos de '+an.qlen+' minutos: la app trabaja con cuartos de 15.');
  IMP={an:an,file:fname,map:{},sure:{},neu:{},updPos:true,rival:an.rival||ROSTER.rival};
  for(var k=0;k<an.cols.length;k++){
    var nm=an.cols[k].name, m=impMatch(nm);
    if(m){ IMP.map[nm]=m.id; IMP.sure[nm]=m.sure; }
    else IMP.map[nm]='';
  }
  if(an.errors.length) return impShowErrors();
  impStep1();
}
function impShowErrors(){
  var h='<div class="mod-ttl" style="color:var(--r-ink)">LA EXCEL TIENE ERRORES</div>';
  h+='<div style="font-size:12px;color:var(--t2);margin-bottom:10px">Corrige estas filas en la Excel y vuelve a importar. Ningun dato de la app se ha modificado.</div>';
  for(var i=0;i<IMP.an.errors.length;i++) h+='<div style="font-size:12px;padding:6px 8px;margin-bottom:4px;background:var(--r-soft);border:1px solid rgba(228,0,43,.3);border-radius:6px;color:var(--r-ink);font-weight:700">'+impEsc(IMP.an.errors[i])+'</div>';
  h+='<div class="mod-acts"><button class="btn-n" style="flex:1" onclick="closeMod()">CERRAR</button></div>';

}
function impStepHdr(n,title){
  var st=['JUGADORES','EMPAREJAMIENTOS','CONFIRMAR'], h='<div style="display:flex;gap:4px;margin-bottom:12px">';
  for(var i=0;i<st.length;i++){

}
function impPlayerOpts(sel){

function impApply(){
  var A=IMP.an, map={}, base=Date.now(), seq=0;
  // 1. jugadores nuevos, alias, posicion y rol tactico
  for(var k=0;k<A.cols.length;k++){
    var col=A.cols[k], nm=col.name, v=IMP.map[nm], p;
    if(v==='NEW'){
      var ni=IMP.neu[nm]||{}, id=base+(seq++);
      p={id:id,num:parseInt(ni.num,10),name:(ni.name||nm).trim(),nick:nm,pos:col.pos||'MID',roles:{},alias:[]};
      POOL.push(p); ROSTER.roles[id]={}; MATCH.pos[id]={x:50,y:50};
      v=id;
    }
    p=gP(v); map[nm]=v;
    if(!p) continue;
    if(!p.alias) p.alias=[];
    if(impNorm(nm)!==impNorm(p.nick)){
      var have=false; for(var a=0;a<p.alias.length;a++) if(impNorm(p.alias[a])===impNorm(nm)) have=true;
      if(!have) p.alias.push(nm);
    }
    if(IMP.updPos&&col.pos&&col.pos!=='GK') p.pos=col.pos;
    var sl=slotFromLabel(col.grp,A.tac[nm]); if(sl) p.slot=sl;
    if(A.tac[nm]) p.tac={def:A.tac[nm].def||'',at:A.tac[nm].at||''};
  }
  // 2. porteros: se conservan los convocados; si no hay, por ranking
  var gks=[], conv=ROSTER.squad.concat(ROSTER.bench);
  for(var i=0;i<conv.length;i++){ var gp=gP(conv[i]); if(gp&&gp.pos==='GK'&&gks.indexOf(gp.id)<0) gks.push(gp.id); }
  if(!gks.length){
    var all=POOL.filter(function(x){return x.pos==='GK';});
    all.sort(function(a,b){ return ((ROSTER.roles[a.id]||{}).gk||99)-((ROSTER.roles[b.id]||{}).gk||99); });
    for(var i=0;i<all.length&&i<2;i++) gks.push(all[i].id);
  }
  if(IMP.gkInit){ gks=[]; if(IMP.gk1) gks.push(IMP.gk1); if(IMP.gk2&&IMP.gk2!==IMP.gk1) gks.push(IMP.gk2); }
  var gk1=gks.length?gks[0]:null, gkB=gks.slice(1);
  // porteros no elegidos: fuera de la convocatoria
  for(var gi=0;gi<POOL.length;gi++){ var gpp=POOL[gi]; if(gpp.pos!=='GK'||gks.indexOf(gpp.id)>=0) continue; var si=ROSTER.squad.indexOf(gpp.id); if(si>=0) ROSTER.squad.splice(si,1); var bi0=ROSTER.bench.indexOf(gpp.id); if(bi0>=0) ROSTER.bench.splice(bi0,1); }
  function ids(names){ var r=[]; for(var i=0;i<names.length;i++) r.push(map[names[i]]); return r; }
  // 3. convocatoria
  var xi=ids(A.blocks[IMP.qBlock[0]][0].on), allF=ids(A.cols.map(function(c){return c.name;}));
  ROSTER.squad=xi.concat(gk1?[gk1]:[]);
  ROSTER.bench=allF.filter(function(id){return xi.indexOf(id)<0;}).concat(gkB);
  // 4. 11 inicial de cada cuarto
  MATCH.qStart={1:null,2:null,3:null,4:null};
  for(var q=2;q<=4;q++) MATCH.qStart[q]=ids(A.blocks[IMP.qBlock[q-1]][0].on).concat(gk1?[gk1]:[]);
  // 5. cambios
  var pairs=[];
  for(var q=1;q<=4;q++){
    for(var k=0;k<IMP.qKeys[q].length;k++){
      var t=IMP.trans[IMP.qKeys[q][k]], lst=t.fixed.map(function(f){return [f[0],f[1]];});
      for(var s=0;s<t.sets.length;s++) for(var o in t.sets[s].ch) lst.push([o,t.sets[s].ch[o]]);
      for(var j=0;j<lst.length;j++) pairs.push({id:base+1000+(seq++),q:q,cd:t.cd,out:map[lst[j][0]],inp:map[lst[j][1]]});
    }
  }
  MATCH.pairs=pairs; MATCH.mirror=false; MATCH.curQ=1;
  MATCH.basePlan=null; MATCH.unavail={}; MATCH.incLog=[];
  MATCH.posDragged={};
  if(IMP.rival) ROSTER.rival=IMP.rival;
  var nPlay=pairs.filter(function(p){return p.cd>0;}).length;
  MATCH.importInfo={file:IMP.file,title:A.title||'',at:new Date().toISOString(),n:nPlay};
  IMP=null;
  doSave();
  var bx=document.getElementById('mod-box'); if(bx) bx.style.maxWidth='';
  closeMod(); rHdr(); go(1);
  toast('Excel importada: '+nPlay+' cambios programados','ok');
}

function slotFromLabel(label,tac){

function pCov(p){

// Plan actual como matriz: S[q-1][i] = jugadores de campo (sin portero) en la fila del minuto 15-i
function planStates(){
  var S=[], cur=null;
  for(var q=1;q<=4;q++){
    var src=(MATCH.mirror&&q>2)?q-2:q, start;
    if(q===1){
      start=(MATCH.qStart&&MATCH.qStart[1])?MATCH.qStart[1]:(MATCH.phase==='pre'||!MATCH.log.length||!MATCH.log[0].ids?ROSTER.squad:MATCH.log[0].ids);
    } else if(MATCH.qStart&&MATCH.qStart[q]) start=MATCH.qStart[q];
    else {
      start=cur.slice();
      var ip=MATCH.pairs.filter(function(p){return p.q===q&&p.cd===0;});
      for(var k=0;k<ip.length;k++){ var oi=start.indexOf(ip[k].out); if(oi>=0&&start.indexOf(ip[k].inp)<0) start[oi]=ip[k].inp; }
    }
    var st=noGK(start).slice(), rows=[];
    var qp=MATCH.pairs.filter(function(p){return p.q===src&&p.cd>0;});
    for(var m=15;m>=1;m--){
      for(var j=0;j<qp.length;j++){
        if(qp[j].cd!==m) continue;
        var o=st.indexOf(qp[j].out);
        if(o>=0&&st.indexOf(qp[j].inp)<0) st[o]=qp[j].inp;
      }
      rows.push(st.slice());
    }
    S.push(rows); cur=rows[14];

function rowIdxNow(){

function convIds(){ return ROSTER.squad.concat(ROSTER.bench).concat((MATCH.pb||[]).map(function(e){return e.id;})); }

// Clase de un candidato para cubrir el puesto 'slot' (menor = mejor)
function covClass(p,slot){
  var c=pCov(p);
  if(c[slot]==='h') return pSlot(p)===slot?0:1;      // de oficio / habitual
  if(SLOT_LINE[slot]==='DEF'&&(c.CEN==='h'||c.LAT==='h')) return 2;  // misma linea defensiva
  if(c[slot]==='e') return 3;                          // emergencia
  return 9;
}

// Reparto: rellena los huecos de los no disponibles desde (q,ri) en adelante
function rpBuild(q,ri,targetNow,seed){
  var base=MATCH.basePlan||planStates();
  var N=[], SL=[];
  for(var a=0;a<4;a++){ N.push([]); SL.push([]);
    for(var b=0;b<15;b++){ N[a].push(base[a][b].slice()); var sm={}; for(var k=0;k<base[a][b].length;k++) sm[base[a][b][k]]=pSlot(gP(base[a][b][k])); SL[a].push(sm); } }
  var un=MATCH.unavail||{}, cap=MATCH.capMin||50, conv=convIds(), exp=MATCH.expelled||[];
  var load={};
  function addLoad(id,d){ load[id]=(load[id]||0)+d; }
  for(var a2=0;a2<4;a2++) for(var b2=0;b2<15;b2++) for(var k2=0;k2<N[a2][b2].length;k2++) addLoad(N[a2][b2][k2],1);

    for(var k3=0;k3<N[q-1][ri].length;k3++) addLoad(N[q-1][ri][k3],-1);
    for(var k4=0;k4<tgt.length;k4++) addLoad(tgt[k4],1);
    N[q-1][ri]=tgt; SL[q-1][ri]=tsm;
  }
  var startA=q-1, startB=targetNow?ri+1:ri;
  for(var qa=startA;qa<4;qa++){
    for(var ib=(qa===startA?startB:0);ib<15;ib++){

      var holes=[];

        var id=row[x];
        if(un[id]||exp.indexOf(id)>=0){ holes.push({x:id,slot:sm2[id]||pSlot(gP(id))}); row.splice(x,1); delete sm2[id]; addLoad(id,-1); }
      }

      for(var px in prev){ var still=false; for(var h0=0;h0<holes.length;h0++) if(String(holes[h0].x)===String(px)) still=true; if(!still) delete prev[px]; }
      holes.sort(function(a,b){ return (a.slot==='CEN'?0:1)-(b.slot==='CEN'?0:1); });
      for(var hh=0;hh<holes.length;hh++){

          var cl=covClass(gP(cid),H.slot); if(cl>3) continue;

// Pares de una transicion A->B emparejando por puesto, luego por linea
function rpPairs(A,B,sa,sb){
  var outs=A.filter(function(x){return B.indexOf(x)<0;}), ins=B.filter(function(x){return A.indexOf(x)<0;}), res=[], used={};
  function slotA(id){ return sa[id]||pSlot(gP(id)); }
  function slotB(id){ return sb[id]||pSlot(gP(id)); }
  var passes=[function(o,i){return slotA(o)===slotB(i);}, function(o,i){return SLOT_LINE[slotA(o)]===SLOT_LINE[slotB(i)];}, function(){return true;}];
  var left=outs.slice();
  for(var p=0;p<passes.length;p++){
    for(var k=left.length-1;k>=0;k--){
      for(var j=0;j<ins.length;j++){ if(used[ins[j]]) continue; if(passes[p](left[k],ins[j])){ res.push([left[k],ins[j]]); used[ins[j]]=1; left.splice(k,1); break; } }
    }

}

function rpApply(R,q,ri,immediate){

    var pr=rpPairs(real,R.N[q-1][ri],{},R.SL[q-1][ri]);
    for(var a=0;a<pr.length;a++) newPairs.push({id:base+(n++),q:q,cd:15-ri,out:pr[a][0],inp:pr[a][1],inc:1});
  }

  var x=parseInt(btn.dataset.pid), p=gP(x);
  if(!isUnavail(x)) return;
  if(!(isQ()||isBk())) return toast('Disponible durante el partido','warn');
  var q=curQForPlan(), ri=rowIdxNow(), info=MATCH.unavail[x];
  delete MATCH.unavail[x];
  var R=rpBuild(q,ri,null,null);
  MATCH.unavail[x]=info;
  var real=realityField(), now=rpPairs(real,R.N[q-1][ri],{},R.SL[q-1][ri]);
  _inj={x:x,R:R};
  var h='<div class="mod-ttl" style="color:var(--g-ink)">VUELVE AL PLAN · #'+p.num+' '+impEsc(p.nick)+'</div>';
  h+='<div style="font-size:15px;color:var(--t2);margin-bottom:10px">Se recupera el plan original desde este minuto'+(Object.keys(MATCH.unavail).length>1?' (manteniendo el reparto de los otros no disponibles)':'')+'.</div>';
  if(now.length){
    h+='<span class="lbl" style="margin-top:0">CAMBIOS PARA CUADRAR CON EL PLAN AHORA</span>';
    for(var i=0;i<now.length;i++) h+='<div style="font-size:15px;padding:3px 0"><span class="chg-out">#'+gP(now[i][0]).num+' '+impEsc(gP(now[i][0]).nick)+'</span> <span class="chg-arr">&#8594;</span> <span class="chg-in">#'+gP(now[i][1]).num+' '+impEsc(gP(now[i][1]).nick)+'</span></div>';
    h+='<div style="font-size:11px;color:var(--t2);margin-top:4px">Apareceran como CAMBIO AHORA en la lista de pendientes.</div>';
  } else h+='<div style="font-size:15px;color:var(--t2)">No hace falta ningun cambio inmediato: entrara en su siguiente turno del plan.</div>';
  h+='<div class="mod-acts"><button class="btn-r" style="flex:1;background:var(--g)" onclick="retConfirm()">CONFIRMAR</button><button class="btn-n" onclick="closeMod()">CANCELAR</button></div>';
  impMod(h);
}
function retConfirm(){
  var x=_inj.x, q=curQForPlan(), ri=rowIdxNow(), p=gP(x);
  delete MATCH.unavail[x];
  var R=rpBuild(q,ri,null,null);
  rpApply(R,q,ri,true);
  if(!MATCH.incLog) MATCH.incLog=[];
  MATCH.incLog.push({type:'vuelve',id:x,q:q,sec:MATCH.matchTime});
  _inj=null; closeMod(); save(); if(CUR===2) rPartido();
  toast('#'+p.num+' '+p.nick+' vuelve al plan original','ok');
}
// Menu del jugador en banquillo
function benchTap(el){
  var id=parseInt(el.dataset.pid), p=gP(id); if(!p) return;
  if(!(isQ()||isBk())) return;
  if(isUnavail(id)){ openReturn(el); return; }
  if(isGK(id)) return;
  openMod('<div class="mod-ttl">#'+p.num+' '+impEsc(p.nick)+' · BANQUILLO</div>'+
    '<div style="font-size:15px;color:var(--t2);margin-bottom:10px">Si este jugador no puede seguir (lesion, molestias), la app lo quita del plan y reparte sus minutos.</div>'+
    '<div class="mod-acts"><button class="btn-r" style="flex:1" data-pid="'+id+'" onclick="openInjury(this)">LESION / NO DISPONIBLE</button><button class="btn-n" onclick="closeMod()">CANCELAR</button></div>');
}
// Ficha: puestos que puede cubrir
function covEditor(p){
  var c=pCov(p), h='<div class="frow"><label class="flbl">CUBRE</label><div style="display:flex;gap:5px;flex-wrap:wrap">';
  for(var i=0;i<SLOTS.length;i++){
    var s=SLOTS[i], v=c[s]||'';
    h+='<button type="button" data-s="'+s+'" data-v="'+v+'" onclick="covCycle(this)" class="cov-chip" style="border:1.5px solid '+(v==='h'?'var(--g)':v==='e'?'var(--a)':'var(--bd)')+';background:'+(v==='h'?'var(--g-soft)':v==='e'?'var(--a-soft)':'var(--card)')+';color:'+(v==='h'?'var(--g-ink)':v==='e'?'var(--a-ink)':'var(--t3)')+';padding:6px 9px;border-radius:7px;font-size:15px;font-weight:800">'+SLOT_LBL[s].toUpperCase()+(v==='h'?' ✓':v==='e'?' (emerg.)':'')+'</button>';
  }
  h+='</div></div><div style="font-size:10px;color:var(--t3);margin:-4px 0 8px 62px">Toca para cambiar: habitual ✓ → emergencia → no</div>';
  return h;
}
function covCycle(btn){
  var v=btn.dataset.v, nv=v===''?'h':v==='h'?'e':'';
  btn.dataset.v=nv;
  btn.style.borderColor=nv==='h'?'var(--g)':nv==='e'?'var(--a)':'var(--bd)';
  btn.style.background=nv==='h'?'var(--g-soft)':nv==='e'?'var(--a-soft)':'var(--card)';
  btn.style.color=nv==='h'?'var(--g-ink)':nv==='e'?'var(--a-ink)':'var(--t3)';
  btn.textContent=SLOT_LBL[btn.dataset.s].toUpperCase()+(nv==='h'?' ✓':nv==='e'?' (emerg.)':'');
}
function covRead(){
  var els=document.querySelectorAll('.cov-chip'), c={};
  for(var i=0;i<els.length;i++) if(els[i].dataset.v) c[els[i].dataset.s]=els[i].dataset.v;
  return c;
}
// Ejecucion segura de los cambios de inicio de cuarto (sobre la realidad, no sobre el plan)
function autoExecOverdue(q){
  var pend=allPending(q,QD), n=0;
  for(var i=0;i<pend.length;i++){ if(pend[i].sl<=0){ execPair(pend[i].pairId,pend[i].mk,true); n++; } }
  return n;
}

// ══════════════════════════════════════════════════
// ROSTER EXPORT / IMPORT
// ══════════════════════════════════════════════════
function exportRoster(){
  var data={
    pool:POOL,
    squad:ROSTER.squad,
    bench:ROSTER.bench,
    roles:ROSTER.roles,
    pcVars:ROSTER.pcVars,
    nextVid:ROSTER.nextVid,
    rival:ROSTER.rival,
    pairs:MATCH.pairs,
    mirror:MATCH.mirror,
    qStart:MATCH.qStart,
    importInfo:MATCH.importInfo,
    exported:new Date().toISOString().slice(0,10),
    version:'rs32'
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;
  a.download='RedSticks-Plantilla-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Plantilla exportada','ok');
}
function importRoster(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json';
  inp.onchange=function(e){
    var file=e.target.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(d.pool&&d.pool.length){
          POOL.length=0;
          for(var i=0;i<d.pool.length;i++) POOL.push(d.pool[i]);
        }
        if(d.squad) ROSTER.squad=d.squad;
        if(d.bench) ROSTER.bench=d.bench;
        if(d.roles) ROSTER.roles=d.roles;
        if(d.pcVars) ROSTER.pcVars=d.pcVars;
        if(d.nextVid) ROSTER.nextVid=d.nextVid;
        if(d.rival) ROSTER.rival=d.rival;
        if(d.pairs) MATCH.pairs=d.pairs;
        if(d.mirror!==undefined) MATCH.mirror=d.mirror;
        if(d.qStart) MATCH.qStart=d.qStart;
        if(d.importInfo!==undefined) MATCH.importInfo=d.importInfo;
        save();
        rPlantilla();
        var msg='Plantilla importada correctamente';
        if(d.pairs) msg+=' ('+d.pairs.length+' cambios programados)';
        toast(msg,'ok');
      }catch(err){
        toast('Error al importar: archivo invalido','urgent');
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ══════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════
var LS='redsticks-esp-absoluta', _st=null;
function save(){ clearTimeout(_st); _st=setTimeout(doSave,1500); }
setInterval(doSave,15000);
function doSave(){
  try{
    localStorage.setItem(LS,JSON.stringify({
      roster:{
        squad:ROSTER.squad, bench:ROSTER.bench,
        roles:ROSTER.roles, pcVars:ROSTER.pcVars,
        nextVid:ROSTER.nextVid, rival:ROSTER.rival
      },
      match:{
        pairs:MATCH.pairs, mirror:MATCH.mirror, curQ:MATCH.curQ,
        phase:MATCH.phase, qElapsed:MATCH.qElapsed,
        matchTime:MATCH.matchTime, breakCd:MATCH.breakCd,
        score:MATCH.score, qLog:MATCH.qLog, log:MATCH.log,
        execIds:MATCH.execIds, alerted:MATCH.alerted,
        events:MATCH.events, pos:MATCH.pos, posDragged:MATCH.posDragged,
        videoStartAt:MATCH.videoStartAt, qWallStart:MATCH.qWallStart, manual:MATCH.manual, qStart:MATCH.qStart, importInfo:MATCH.importInfo, unavail:MATCH.unavail, basePlan:MATCH.basePlan, incLog:MATCH.incLog, capMin:MATCH.capMin,
        pb:MATCH.pb, expelled:MATCH.expelled
      },
      pool:POOL
    }));
  }catch(e){console.warn('save',e);}
}
function doLoad(){
  try{
    var raw=localStorage.getItem(LS); if(!raw) return false;
    var d=JSON.parse(raw);
    if(d.pool&&d.pool.length){
      POOL.length=0;
      for(var i=0;i<d.pool.length;i++) POOL.push(d.pool[i]);
    }
    if(d.roster){
      var r=d.roster;
      if(r.squad) ROSTER.squad=r.squad;
      if(r.bench) ROSTER.bench=r.bench;
      if(r.roles) ROSTER.roles=r.roles;
      if(r.pcVars) ROSTER.pcVars=r.pcVars;
      if(r.nextVid) ROSTER.nextVid=r.nextVid;
      if(r.rival) ROSTER.rival=r.rival;
    }
    if(d.match){
      var m=d.match;
      var keys=['pairs','mirror','curQ','phase','qElapsed','matchTime','breakCd',
                'score','qLog','log','execIds','alerted','events','pos','posDragged',
                'videoStartAt','qWallStart','manual','qStart','importInfo','unavail','basePlan','incLog','capMin','pb','expelled'];
      for(var i=0;i<keys.length;i++) if(m[keys[i]]!==undefined) MATCH[keys[i]]=m[keys[i]];
    }
    return true;
  }catch(e){console.warn('load',e);return false;}
}

// ── START ──
initROSTER();
doLoad();
go(0);
</script>
<script>
// ══════════════════════════════════════════════════
// REDSTICKS v34 · CAPA DE APP INSTALABLE
// No modifica el motor de cambios: solo instalacion, uso sin conexion,
// pantalla siempre encendida, guardado al salir, aviso de version nueva,
// reloj que sigue contando con el iPad bloqueado (v34) y franjas por minuto (v34).
// ══════════════════════════════════════════════════
(function(){
  var APP_VERSION='v34';
  var st={sw:'no',offline:false,persist:null,wake:false,waiting:null};
  function standalone(){
    return !!(window.navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches));
  }
  function say(m,t){ try{ toast(m,t); }catch(e){} }

  // 1 · Chip de version en la cabecera (tocar = estado de la app)
  function addChip(){
    var b=document.getElementById('thm-btn'); if(!b||document.getElementById('rs-ver')) return;
    var c=document.createElement('button');
    c.id='rs-ver'; c.type='button'; c.textContent=APP_VERSION;
    c.setAttribute('aria-label','Version y estado de la app');
    c.onclick=showStatus;
    b.parentNode.insertBefore(c,b);
  }
  function showStatus(){
    var l=[];
    l.push('<b>RedSticks '+APP_VERSION+'</b>');
    l.push(standalone()?'Instalada en pantalla de inicio':'Abierta en el navegador (sin instalar)');
    l.push(st.offline?'Lista para usar sin conexion':'Sin conexion: todavia NO disponible');
    l.push(st.persist===true?'Datos protegidos por el sistema':'Datos en este dispositivo');
    l.push(st.wake?'Pantalla siempre encendida: activa':'Pantalla siempre encendida: no activa');
    say(l.join('<br>'),'info');
    if(st.waiting) offerUpdate(); else checkUpdate();
  }

  // 2 · Uso sin conexion y actualizaciones (nunca se actualiza sola en mitad de un partido)
  var reg=null, reloading=false;
  function offerUpdate(){
    say('Hay una version nueva de RedSticks. <button id="rs-upd" style="margin-left:8px;padding:6px 12px;border-radius:8px;border:0;background:#FF1F47;color:#fff;font-weight:700" onclick="window.rsApplyUpdate()">Actualizar ahora</button><br><span style="opacity:.8">Hazlo fuera de partido: la app se recarga.</span>','urgent');
  }
  window.rsApplyUpdate=function(){
    try{ doSave(); }catch(e){}
    if(st.waiting) st.waiting.postMessage({type:'SKIP_WAITING'});
  };
  function checkUpdate(){ if(reg&&navigator.onLine){ try{ reg.update(); }catch(e){} } }
  function watch(w){
    if(!w) return;
    w.addEventListener('statechange',function(){
      if(w.state==='installed'&&navigator.serviceWorker.controller){ st.waiting=w; offerUpdate(); }
      if(w.state==='activated'){ st.offline=true; }
    });
  }
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(r){
        reg=r; st.sw='ok';
        if(r.active) st.offline=true;
        if(r.waiting&&navigator.serviceWorker.controller){ st.waiting=r.waiting; offerUpdate(); }
        watch(r.installing);
        r.addEventListener('updatefound',function(){ watch(r.installing); });
      }).catch(function(e){ st.sw='error'; console.warn('sw',e); });
      navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(reloading||!st.waiting) return; reloading=true; location.reload();
      });
    });
  }

  // 3 · Pedir al sistema que no borre los datos guardados
  if(navigator.storage&&navigator.storage.persist){
    navigator.storage.persist().then(function(ok){ st.persist=ok; }).catch(function(){});
  }

  // 4 · Pantalla siempre encendida mientras la app esta a la vista
  var lock=null;
  function wake(){
    if(!('wakeLock' in navigator)||document.visibilityState!=='visible'||lock) return;
    navigator.wakeLock.request('screen').then(function(l){
      lock=l; st.wake=true;
      l.addEventListener('release',function(){ lock=null; st.wake=false; });
    }).catch(function(){ st.wake=false; });
  }
  wake();
  document.addEventListener('pointerdown',wake,{passive:true});

  // 5 · Reloj con el iPad bloqueado (v34)
  // El motor cuenta un segundo por "tic". Con la pantalla bloqueada iOS congela los tics:
  // al volver se reproducen los tics que faltan, uno a uno, con la misma logica del motor
  // (avisos de cambio, tarjetas, fin de cuarto y descanso). No se cambia ninguna regla.
  // tickCore es copia fiel del cuerpo de startTmr(): si cambia alli, debe cambiar aqui.
  var CK='rs_clock', MAX_RESUME=1800, hiddenAt=0;
  function clockLive(){ return !!MATCH.running&&(isQ()||isBk()); }
  function tickCore(){
    if(isBk()){
      MATCH.breakCd--;
      if(MATCH.breakCd<=0){MATCH.running=false;MATCH.breakCd=0;clearInterval(tiInt);}
    } else if(isQ()){
      MATCH.qElapsed++;MATCH.matchTime++;
      if(MATCH.qElapsed>=QD){autoEndQ();return;}
      checkAlerts();
      checkPBTimers();
    }
  }
  function catchUp(n,from){
    clearInterval(tiInt);
    // Las horas reales de lo que ocurra durante la puesta al dia (fin de cuarto, cambios
    // automaticos) se anotan en el segundo en que habrian ocurrido, no en el de desbloqueo.
    var t0=arguments.length>1?arguments[1]:Date.now()-n*1000;
    for(var i=0;i<n&&clockLive();i++){
      var nl=MATCH.log.length, nq=MATCH.qLog.length, w=t0+(i+1)*1000, j;
      tickCore();
      for(j=nl;j<MATCH.log.length;j++) if(MATCH.log[j].wall) MATCH.log[j].wall=w;
      for(j=nq;j<MATCH.qLog.length;j++) if(MATCH.qLog[j].wallEnd) MATCH.qLog[j].wallEnd=w;
    }
    if(MATCH.running) startTmr();
    rHdr(); if(CUR===2) rPartido();
    if(n>=5) say('Reloj al dia: +'+ft(n)+' con la pantalla bloqueada','info');
  }
  function anchor(){
    try{ localStorage.setItem(CK,JSON.stringify({t:hiddenAt||Date.now(),run:clockLive(),ph:MATCH.phase})); }catch(e){}
  }
  function flush(){ try{ doSave(); }catch(e){} anchor(); }
  function onHide(){
    if(!hiddenAt&&clockLive()){ clearInterval(tiInt); hiddenAt=Date.now(); }
    flush();
  }
  function onShow(){
    if(hiddenAt){
      var h0=hiddenAt, n=Math.round((Date.now()-h0)/1000); hiddenAt=0;
      if(n>0) catchUp(n,h0); else if(MATCH.running) startTmr();
      flush();
    }
    wake(); checkUpdate();
  }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden') onHide(); else onShow();
  });
  window.addEventListener('pagehide',onHide);
  window.addEventListener('pageshow',function(e){ if(e.persisted) onShow(); });
  setInterval(function(){ if(!hiddenAt) anchor(); },5000);
  // Si iOS cerro la app mientras el reloj corria, al reabrir se recupera el tiempo real.
  (function resume(){
    var a=null; try{ a=JSON.parse(localStorage.getItem(CK)); }catch(e){}
    if(!a||!a.run||a.ph!==MATCH.phase||!(isQ()||isBk())) return;
    var n=Math.round((Date.now()-a.t)/1000);
    if(n<0) return;
    if(n>MAX_RESUME){ say('El reloj estaba en marcha al cerrar la app hace mas de 30 min: se deja parado en '+(isBk()?ft(MATCH.breakCd):cdQ())+'.','warn'); anchor(); return; }
    MATCH.running=true; catchUp(n,a.t); go(2); flush();
  })();

  // 5b · Franjas por minuto en la columna de cambios (v34): solo pinta, no decide nada
  function band(){
    var rows=document.querySelectorAll('#match-body .pend-row'), last=null, k=0, first=null, cnt=0;
    function close(){ if(first&&cnt>1){ var m=first.querySelector('.pr-min'); if(m) m.setAttribute('data-n',cnt); } }
    for(var i=0;i<rows.length;i++){
      var m=rows[i].querySelector('.pr-min'); if(!m) continue;
      var v=m.textContent;
      if(v!==last){ close(); if(last!==null) k++; last=v; first=rows[i]; cnt=0; rows[i].classList.add('rs-gfirst'); }
      cnt++;
      rows[i].classList.add(k%2?'rs-gb':'rs-ga');
    }
    close();
  }
  var _rP=window.rPartido;
  window.rPartido=function(){ var r=_rP.apply(this,arguments); try{ band(); }catch(e){} return r; };

  // 6 · Gestos accidentales: zoom con dos dedos (el doble toque se anula por CSS)
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

  addChip();
  window.RS_APP={version:APP_VERSION,state:st,standalone:standalone};
})();
</script>
