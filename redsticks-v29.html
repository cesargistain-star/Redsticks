<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>RedSticks · ESP Absoluta</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --r:#C8102E;--n:#16213e;--g:#16a34a;--a:#f59e0b;--b:#2563eb;--p:#7c3aed;
  --bd:#dde1ef;--bg:#f0f2f8;--card:#ffffff;
  --t:#16213e;--t2:#5a6080;--t3:#a0a8c0;
}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Barlow Condensed',sans-serif;overflow:hidden}
button,select,input{font-family:'Barlow Condensed',sans-serif;-webkit-appearance:none;touch-action:manipulation;outline:none}
button{cursor:pointer}
select,input{color:var(--t);background:var(--card);border:1.5px solid var(--bd)}

/* ── APP SHELL ── */
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
#hdr{background:var(--n);padding:7px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo{font-size:19px;font-weight:900;letter-spacing:4px;color:#fff;line-height:1}
.logo em{color:var(--r);font-style:normal}
.logo-sub{font-size:7px;color:#6a7090;letter-spacing:2px;margin-top:1px}
.hdr-mid{flex:1;display:none;align-items:center;justify-content:center;gap:14px}
.hdr-mid-on{display:flex}
.sc-wrap{display:flex;align-items:center;gap:5px}
.sc-team{font-size:8px;color:#888;letter-spacing:2px;font-weight:700;text-align:center}
.sc-num{font-size:32px;font-weight:900;color:#fff;font-family:monospace;width:34px;text-align:center;line-height:1}
.sc-sep{font-size:18px;color:#444;margin:0 2px}
.sc-adj{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#aaa;width:22px;height:22px;border-radius:5px;font-size:13px;display:flex;align-items:center;justify-content:center}
.tmr-wrap{display:flex;flex-direction:column;align-items:center}
.tmr{font-size:34px;font-weight:900;font-family:monospace;color:#4ade80;letter-spacing:2px;line-height:1}
.tmr-phase{font-size:7px;color:#888;letter-spacing:2px;font-weight:700;margin-top:1px}
.qpips{display:flex;gap:3px;margin-top:2px}
.qpip{width:18px;height:4px;border-radius:2px;background:#333}
.qpip-a{background:var(--r)}.qpip-d{background:var(--g)}
.riv-btn{margin-left:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#aaa;padding:5px 10px;font-size:8px;font-weight:700;border-radius:6px;letter-spacing:1px}

/* ── TABS ── */
#tabs{background:var(--n);display:flex;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06)}
.tab{flex:1;background:none;border:none;border-bottom:3px solid transparent;color:#666;padding:9px 4px;font-size:9px;letter-spacing:2px;font-weight:800;cursor:pointer;margin-bottom:-1px}
.tab-a{border-bottom-color:var(--r);color:#fff}

/* ── BREAK BANNER ── */
#brk{display:none;background:#eff6ff;border-bottom:2px solid rgba(37,99,235,.3);padding:10px 16px;align-items:center;gap:12px;flex-shrink:0}
.brk-info{flex:1}
.brk-title{font-size:11px;font-weight:800;color:var(--b);letter-spacing:2px}
.brk-sub{font-size:9px;color:var(--t2);margin-top:2px}
.brk-tmr{font-size:32px;font-weight:900;color:var(--b);font-family:monospace}
.brk-btn{background:var(--b);border:none;color:#fff;padding:10px 16px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;min-height:42px}

/* ── SCREENS ── */
#screens{flex:1;overflow:hidden;position:relative}
.scr{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 32px}
.scr-on{display:block}
.scr-flex{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr-flex-on{display:flex}

/* ── COMMON ── */
.lbl{font-size:7px;letter-spacing:3px;color:var(--t3);font-weight:800;text-transform:uppercase;margin-bottom:8px;margin-top:14px;display:block}
.lbl:first-child{margin-top:0}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.btn-r{background:var(--r);border:none;color:#fff;padding:11px 18px;font-size:10px;letter-spacing:2px;font-weight:800;border-radius:8px;min-height:44px}
.btn-n{background:var(--card);border:1.5px solid var(--bd);color:var(--t);padding:9px 14px;font-size:10px;font-weight:700;border-radius:8px;min-height:40px}
.btn-sm{padding:6px 12px;font-size:9px;min-height:32px;border-radius:6px}
.finp{background:var(--card);border:1.5px solid var(--bd);color:var(--t);padding:9px 12px;font-size:13px;border-radius:8px;min-height:42px;width:100%}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.flbl{font-size:8px;letter-spacing:2px;color:var(--t2);width:52px;flex-shrink:0;font-weight:700}

/* ── PLANTILLA ── */
.sub-tabs{display:flex;border-bottom:1.5px solid var(--bd);margin-bottom:12px}
.stab{flex:1;background:none;border:none;border-bottom:3px solid transparent;color:var(--t2);padding:9px 4px;font-size:9px;font-weight:800;letter-spacing:1px;cursor:pointer;margin-bottom:-2px}
.stab-a{border-bottom-color:var(--r);color:var(--t)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-bottom:10px}
.ptile{background:var(--card);border:1.5px solid var(--bd);border-radius:9px;padding:8px 10px;cursor:pointer;transition:transform .1s}
.ptile:active{transform:scale(.96)}
.ptile-f{border-color:var(--g);background:#f0fdf4}
.ptile-b{border-color:var(--a);background:#fffbeb}
.ptile-o{opacity:.32}
.pt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.pt-num{font-size:24px;font-weight:900;color:var(--r);font-family:monospace;line-height:1}
.pt-edit{background:none;border:none;color:var(--t3);font-size:15px;cursor:pointer;padding:2px 4px}
.pt-name{font-size:13px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.pt-pos{font-size:7px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:1px;display:inline-block}
.pos-GK{background:rgba(124,58,237,.15);color:#7c3aed;border:1px solid rgba(124,58,237,.3)}
.pos-DEF{background:rgba(37,99,235,.12);color:var(--b);border:1px solid rgba(37,99,235,.25)}
.pos-MID{background:rgba(22,163,74,.12);color:var(--g);border:1px solid rgba(22,163,74,.25)}
.pos-FWD{background:rgba(200,16,46,.1);color:var(--r);border:1px solid rgba(200,16,46,.2)}
.pt-st{font-size:7px;font-weight:800;padding:2px 7px;border-radius:10px;margin-top:5px;display:inline-block;letter-spacing:1px}
.st-f{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.st-b{background:#fef9c3;color:#a16207;border:1px solid #fde68a}
.st-o{background:#f1f5f9;color:#94a3b8;border:1px solid #e2e8f0}
.roles-tbl{width:100%;border-collapse:collapse;font-size:10px}
.roles-tbl th{background:#f4f5f8;color:var(--t2);padding:7px 4px;font-size:9px;letter-spacing:1px;font-weight:800;text-align:center;border-bottom:1.5px solid var(--bd)}
.roles-tbl th:first-child{text-align:left;padding-left:10px}
.roles-tbl td{padding:6px 4px;text-align:center;border-bottom:1px solid #f0f2f8}
.roles-tbl td:first-child{text-align:left;padding-left:10px;font-weight:700;font-size:12px}
.rk{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:800;cursor:pointer;min-width:22px}
.rk1{background:var(--a);color:#000}
.rk2{background:#fef9c3;color:#a16207;border:1px solid #fde68a}
.rk3{background:#f1f5f9;color:var(--t2);border:1px solid var(--bd)}
.rk0{color:var(--t3);font-size:16px;cursor:pointer}
.var-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.var-card{background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer;border:1.5px solid}
.vc-d{border-color:rgba(37,99,235,.4);background:#eff6ff}
.vc-v{border-color:rgba(124,58,237,.4);background:#f5f3ff}
.vc-rank{font-size:9px;font-weight:800;letter-spacing:1px;margin-bottom:3px}
.vc-name{font-size:15px;font-weight:900;margin-bottom:5px}
.vc-pips{display:flex;flex-wrap:wrap;gap:3px}
.pip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff}
.pip-d{background:var(--b)}.pip-v{background:var(--p)}

/* ── PROGRAMA ── */
.prog-hdr{background:var(--card);border-bottom:1.5px solid var(--bd);padding:9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;position:sticky;top:0;z-index:5}
.qsbtn{background:var(--bg);border:1.5px solid var(--bd);color:var(--t2);padding:8px 14px;font-size:12px;font-weight:800;border-radius:6px;letter-spacing:1px}
.qsbtn-a{background:var(--r);border-color:var(--r);color:#fff}
.mir-btn{background:none;border:1.5px solid var(--g);color:var(--g);padding:6px 10px;font-size:8px;font-weight:800;border-radius:6px;letter-spacing:1px}
.mir-off{border-color:var(--bd);color:var(--t2)}
.tl-bar{display:flex;gap:3px;margin-bottom:6px}
.tl-min{flex:1;min-height:50px;border-radius:7px;background:var(--card);border:1.5px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.tl-min:active{transform:scale(.9)}
.tl-min-cd{font-size:11px;font-weight:800;color:var(--t2);font-family:monospace}
.tl-min-n{font-size:14px;font-weight:900;color:var(--a)}
.tl-has{background:#fffbeb;border-color:var(--a)}
.tl-start{background:#fff0f0;border:1.5px solid rgba(200,16,46,.35);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.chg-item{background:var(--card);border:1.5px solid var(--bd);border-radius:9px;padding:9px 12px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.chg-t{font-size:15px;font-weight:800;color:var(--a);min-width:50px;font-family:monospace}
.chg-out{font-size:15px;color:var(--r);font-weight:800}
.chg-in{font-size:15px;color:var(--g);font-weight:800}
.chg-arr{color:var(--t3);font-size:13px}
.chg-del{background:none;border:none;color:var(--t3);font-size:18px;margin-left:auto;padding:2px 6px;cursor:pointer}

/* ── PARTIDO ── */
.match-body{padding:10px 14px 32px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mb-cols{display:flex;flex-direction:column;gap:0}
.mb-left{width:100%}
.mb-right{width:100%}
@media (orientation:landscape) and (min-width:780px){
  .mb-cols{display:flex;flex-direction:row;gap:12px;align-items:flex-start}
  .mb-left{width:62%;flex-shrink:0}
  .mb-right{width:38%;max-height:calc(100vh - 140px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .field-wrap{aspect-ratio:91.4/48}
}
.ctrl-row{display:flex;gap:6px;margin-bottom:10px}
.ctrl-play{background:#f0fdf4;border:1.5px solid var(--g);color:var(--g);padding:12px 18px;font-size:13px;font-weight:800;border-radius:9px;min-height:50px;letter-spacing:1px;flex:1}
.ctrl-pause{background:#fffbeb;border:1.5px solid var(--a);color:#92400e;padding:12px 18px;font-size:13px;font-weight:800;border-radius:9px;min-height:50px;letter-spacing:1px;flex:1}
.ctrl-end{background:#fff0f0;border:1.5px solid var(--r);color:var(--r);padding:12px 18px;font-size:13px;font-weight:800;border-radius:9px;min-height:50px;letter-spacing:1px}
.pend-box{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:10px}
.pend-hdr{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);background:#f8f9fc;gap:8px}
.pend-lbl{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--t2)}
.pend-cnt{background:var(--r);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px}
.pend-row{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid #f4f6fb}
.pend-row:last-child{border-bottom:none}
.pend-now{background:#fff5f5}
.pr-min{font-size:19px;font-weight:900;min-width:56px;font-family:monospace;color:var(--t2)}
.pr-sl{font-size:11px;min-width:44px;font-family:monospace}
.pr-sl-now{color:var(--r);font-weight:800}
.pr-sl-soon{color:var(--a);font-weight:800}
.pr-sl-ok{color:var(--t3)}
.pr-out{font-size:17px;font-weight:800;color:var(--r)}
.pr-in{font-size:17px;font-weight:800;color:var(--g)}
.pr-arr{color:var(--t3);font-size:13px}
.pr-exec{background:var(--r);border:none;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;margin-left:auto;min-height:48px;letter-spacing:1px}
.field-wrap{width:100%;aspect-ratio:91.4/40;position:relative;border-radius:10px;overflow:visible;margin-bottom:8px}
.tok{position:absolute;width:76px;height:68px;border-radius:12px;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;user-select:none;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.tok-num{font-size:26px;font-weight:900;line-height:1;font-family:monospace}
.tok-nick{font-size:11px;font-weight:700;max-width:72px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tok-t{font-size:10px;opacity:.85;font-family:monospace}
.tok-gk{background:#7c3aed;border-color:#6d28d9}
.tok-preview{opacity:.55;border-style:dashed!important}
.tok-def{background:var(--b);border-color:#1d4ed8}
.tok-mid{background:var(--g);border-color:#15803d}
.tok-fwd{background:var(--r);border-color:#991b1b}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 2px 6px rgba(0,0,0,.18)}50%{transform:scale(1.1);box-shadow:0 0 0 5px rgba(245,158,11,.35)}}
.tok-pend{animation:pulse .85s ease infinite;border-color:var(--a)!important;border-width:3px!important}
.bench-box{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.bench-hdr{font-size:8px;font-weight:800;letter-spacing:2px;color:var(--t2);margin-bottom:8px}
.bench-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f4f6fb}
.bench-row:last-child{border-bottom:none}
.bench-num{font-size:22px;font-weight:900;min-width:40px;font-family:monospace}
.bench-name{font-size:13px;font-weight:700;flex:1}
.bench-in{font-size:9px;color:var(--g);font-weight:800;letter-spacing:1px}
.ev-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:8px}
.ev-btn{padding:10px 4px;border-radius:9px;border:1.5px solid;font-size:14px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;background:var(--card)}
.ev-sub{font-size:10px;opacity:.75;font-weight:700}
.ev-pcp{border-color:var(--b);color:var(--b)}
.ev-pcn{border-color:var(--a);color:var(--a)}
.ev-gp{border-color:var(--g);color:var(--g)}
.ev-gn{border-color:var(--r);color:var(--r)}

/* ── PC PANEL ── */
#pc-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;align-items:center;justify-content:center;padding:16px}
.pc-box{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.pc-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pc-ttl{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--b)}
.pc-cls{background:none;border:none;color:var(--t2);font-size:22px;cursor:pointer;padding:2px 8px}
.pc-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc-col-lbl{font-size:8px;font-weight:800;letter-spacing:2px;margin-bottom:8px;display:block}
.pc-item{border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;border:1.5px solid}
.pc-item:active{transform:scale(.97)}
.pc-d{background:#eff6ff;border-color:rgba(37,99,235,.4)}
.pc-v{background:#f5f3ff;border-color:rgba(124,58,237,.4)}
.pc-na{opacity:.38;cursor:default}
.pc-rank{font-size:7px;font-weight:800;margin-bottom:3px}
.pc-name{font-size:14px;font-weight:900;margin-bottom:5px}

/* ── MODAL ── */
#mod-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:500;padding:16px}
.mod-box{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.mod-ttl{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--t);margin-bottom:14px}
.mod-acts{display:flex;gap:8px;margin-top:14px}

/* ── TOASTS ── */
#toasts{position:fixed;top:8px;right:8px;z-index:600;display:flex;flex-direction:column;gap:4px;max-width:280px;pointer-events:none}
.toast{padding:8px 12px;border-radius:9px;font-size:11px;font-weight:700;pointer-events:all;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;border:1.5px solid}
.t-ok{background:#f0fdf4;border-color:var(--g);color:#15803d}
.t-warn{background:#fffbeb;border-color:var(--a);color:#92400e}
.t-urgent{background:#fff0f0;border-color:var(--r);color:var(--r)}
.t-info{background:#eff6ff;border-color:var(--b);color:var(--b)}
.t-x{background:none;border:none;color:inherit;font-size:15px;margin-left:auto;cursor:pointer}

/* ── INFORME ── */
.pb-box{background:#fff7ed;border:1.5px solid rgba(245,158,11,.4);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.pb-hdr{font-size:8px;font-weight:800;letter-spacing:2px;color:var(--a);margin-bottom:8px}
.pb-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(245,158,11,.15)}
.pb-row:last-child{border-bottom:none}
.pb-card{width:18px;height:24px;border-radius:3px;flex-shrink:0}
.pb-green{background:#22c55e}
.pb-yellow{background:#facc15}
.pb-num{font-size:17px;font-weight:800;font-family:monospace;min-width:34px}
.pb-name{font-size:15px;font-weight:700;flex:1}
.pb-cd{font-size:17px;font-weight:900;font-family:monospace;color:var(--a);min-width:54px;text-align:right}
.pb-cd-done{color:var(--g)}
.pb-btn{background:var(--g);border:none;color:#fff;padding:5px 10px;border-radius:6px;font-size:9px;font-weight:800;cursor:pointer;min-height:30px}
.exp-box{background:#fff0f0;border:1.5px solid rgba(200,16,46,.35);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.exp-hdr{font-size:8px;font-weight:800;letter-spacing:2px;color:var(--r);margin-bottom:8px}
.exp-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.exp-num{font-size:12px;font-weight:800;font-family:monospace;color:var(--r)}
.exp-name{font-size:11px;font-weight:700;color:var(--t2)}
.ev-card{padding:9px 4px;border-radius:9px;border:1.5px solid;font-size:9px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
.ev-cgreen{border-color:#22c55e;background:#f0fdf4;color:#15803d}
.ev-cyellow{border-color:#facc15;background:#fefce8;color:#92400e}
.ev-cred{border-color:var(--r);background:#fff0f0;color:var(--r)}
.tok-pb{opacity:.4;border-style:dashed!important}
.bench-hdr{font-size:8px;font-weight:800;letter-spacing:2px;color:var(--t2);margin-bottom:8px}

/* ── PC PANEL ── */
#pc-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;align-items:center;justify-content:center;padding:16px}
.pc-box{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}

/* ── MODAL ── */
#mod-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:500;padding:16px}

.mod-acts{display:flex;gap:8px;margin-top:14px}

/* ── TOASTS ── */
#toasts{position:fixed;top:8px;right:8px;z-index:600;display:flex;flex-direction:column;gap:4px;max-width:280px;pointer-events:none}
.toast{padding:8px 12px;border-radius:9px;font-size:11px;font-weight:700;pointer-events:all;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;border:1.5px solid}
.t-ok{background:#f0fdf4;border-color:var(--g);color:#15803d}
.t-warn{background:#fffbeb;border-color:var(--a);color:#92400e}
.t-urgent{background:#fff0f0;border-color:var(--r);color:var(--r)}
.t-info{background:#eff6ff;border-color:var(--b);color:var(--b)}
.t-x{background:none;border:none;color:inherit;font-size:15px;margin-left:auto;cursor:pointer}

/* ── INFORME ── */
.inf-row{background:var(--card);border:1.5px solid var(--bd);border-radius:9px;padding:9px 12px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.inf-bar-wrap{height:5px;background:#f0f2f8;border-radius:4px;flex:1;overflow:hidden}
.inf-bar-fill{height:100%;background:linear-gradient(90deg,var(--r),var(--a));border-radius:4px}

<body>

<script>
// ══════════════════════════════════════════════════

// Rules: single-quote outer strings · numeric onclick args
//        for-loops for HTML · no backticks · node-validated
// ══════════════════════════════════════════════════

];

var RDEFS = [
  {id:'pcd1',lbl:'PCD1',grp:'D'},{id:'pcd2',lbl:'PCD2',grp:'D'},
  {id:'pcd3',lbl:'PCD3',grp:'D'},{id:'pcd4',lbl:'PCD4',grp:'D'},

  {id:'pca_s',lbl:'PCA-S',grp:'A'}
];

var FIH = ['NED','BEL','AUS','GER','IND','ARG','GBR','ENG','PAK','MAS',
           'ITA','NZL','RSA','FRA','IRL','KOR','USA','CHN','JPN','EGY',
           'POL','CAN','TPE','UKR','WAL','SCO','SUI','CZE','AUT'];

// ── STATE ──
// Two separate objects: ROSTER (persists) and MATCH (resets per game)
var ROSTER = {
  squad:[], bench:[],        // convocatoria
  roles:{},                  // {pid:{roleId:rank}}
  pcVars:[], nextVid:1,      // variantes PC
  rival:'ITA'
};

var MATCH = {
  pairs:[], mirror:true, curQ:1,   // programacion
  phase:'pre', running:false,
  qElapsed:0, matchTime:0, breakCd:0,
  score:{h:0,a:0}, qLog:[], log:[],
  execIds:[], alerted:{},
  events:[], pos:{}, posDragged:{},
  videoStartAt:0, qWallStart:0,
  manual:false,
  qStart:{1:null,2:null,3:null,4:null},  // explicit 11 per quarter (null = auto; Q1 se fija al iniciar)
  importInfo:null,
  pb:[], expelled:[]
};

var PTAB = 0;  // plantilla sub-tab: 0=jugadores 1=roles 2=variantes
var CUR = 0;   // current screen
var QD = 900;  // quarter duration seconds
var BREAKS = {b12:120, b23:600, b34:120};
var tiInt = null, stopInt = null;

// ── UTILS ──
function ft(s){
  if(s<0)s=0;
  return (s>=600?'':s>=60?'':'0')+Math.floor(s/60)+':'+(Math.floor(s)%60<10?'0':'')+Math.floor(s)%60;
}
function pad2(n){ return n<10?'0'+n:''+n; }
function gP(id){ for(var i=0;i<POOL.length;i++) if(POOL[i].id===id) return POOL[i]; return null; }
function isQ(){ return MATCH.phase==='q1'||MATCH.phase==='q2'||MATCH.phase==='q3'||MATCH.phase==='q4'; }
function isBk(){ return MATCH.phase.charAt(0)==='b'; }
function qNum(){
  var m={q1:1,q2:2,q3:3,q4:4}; return m[MATCH.phase]||1;
}
function cdQ(){ return ft(Math.max(0,QD-MATCH.qElapsed)); }
function inField(id){ return ROSTER.squad.indexOf(id)>=0; }
function onBench(id){ return ROSTER.bench.indexOf(id)>=0; }

// ── LINE POSITIONS ──
function calcLinePos(){
  var lineX={GK:5,DEF:23,MID:50,FWD:75};
  var byPos={GK:[],DEF:[],MID:[],FWD:[]};
  for(var i=0;i<ROSTER.squad.length;i++){
    var p=gP(ROSTER.squad[i]);
    if(p&&byPos[p.pos]) byPos[p.pos].push(p.id);
  }
  var poss=['GK','DEF','MID','FWD'];
  for(var pi=0;pi<poss.length;pi++){
    var pos=poss[pi], ids=byPos[pos], n=ids.length;
    for(var ii=0;ii<n;ii++){
      if(!MATCH.posDragged[ids[ii]]){
        MATCH.pos[ids[ii]]={x:lineX[pos],y:10+(ii+1)*(80/(n+1))};
      }
    }
  }
}

// ── INIT ──
function initROSTER(){
  var gks=[],flds=[];
  for(var i=0;i<POOL.length;i++){
    if(POOL[i].pos==='GK') gks.push(POOL[i].id);
    else flds.push(POOL[i].id);
  }
  for(var i=0;i<10&&i<flds.length;i++) ROSTER.squad.push(flds[i]);
  if(gks.length) ROSTER.squad.push(gks[0]);
  for(var i=10;i<16&&i<flds.length;i++) ROSTER.bench.push(flds[i]);
  if(gks.length>1) ROSTER.bench.push(gks[1]);
  for(var i=0;i<POOL.length;i++){
    var p=POOL[i];
    ROSTER.roles[p.id]={};
    var pr=p.roles||{}, ks=Object.keys(pr);
    for(var k=0;k<ks.length;k++) ROSTER.roles[p.id][ks[k]]=pr[ks[k]];
    MATCH.pos[p.id]={x:50,y:50};
  }
}

// ── NAV ──
function go(n){
  CUR=n;
  var ids=['s0','s1','s2','s3'];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]); if(!el) continue;
    if(i===n){
      if(i===2){ el.className='scr-flex scr-flex-on'; el.style.display='flex'; }
      else { el.className='scr scr-on'; el.style.display='block'; }
    } else {
      el.className=(i===2)?'scr-flex':'scr';
      el.style.display='none';
    }
  }
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].className=i===n?'tab tab-a':'tab';
  var hm=document.getElementById('hdr-mid');
  if(hm) hm.className=n===2?'hdr-mid hdr-mid-on':'hdr-mid';
  if(n===0) rPlantilla();
  if(n===1) rProg();
  if(n===2) rPartido();
  if(n===3) rInforme();
  rHdr();
}

// ── TOASTS ──
var _T=[];
function toast(msg,type){
  var id=Date.now()+Math.random(); type=type||'info';
  _T.push({id:id,msg:msg,type:type});
  rToasts();
  setTimeout(function(){ _T=_T.filter(function(t){return t.id!==id;}); rToasts(); },type==='urgent'?18000:6000);
}
function rToasts(){
  var el=document.getElementById('toasts'); if(!el) return;
  var h='';
  for(var i=0;i<_T.length;i++){
    h+='<div class="toast t-'+_T[i].type+'"><span style="flex:1">'+_T[i].msg+'</span>'+
       '<button class="t-x" data-tid="'+_T[i].id+'" onclick="dismissT(this)">x</button></div>';
  }
  el.innerHTML=h;
}
function dismissT(btn){ var id=parseFloat(btn.dataset.tid); _T=_T.filter(function(t){return t.id!==id;}); rToasts(); }

// ── MODAL ──
function openMod(html){ document.getElementById('mod-box').style.maxWidth=''; document.getElementById('mod-box').innerHTML=html; document.getElementById('mod-bg').style.display='flex'; }
function closeMod(){ document.getElementById('mod-bg').style.display='none'; }

// ══════════════════════════════════════════════════
// PLANTILLA
// ══════════════════════════════════════════════════
function rPlantilla(){
  var el=document.getElementById('pl-content'); if(!el) return;
  var STABS=['JUGADORES','ROLES PC','VARIANTES PC'];
  var h='<div class="sub-tabs">';
  for(var i=0;i<STABS.length;i++){
    h+='<button class="stab'+(PTAB===i?' stab-a':'')+'" data-ti="'+i+'" onclick="setPTAB(this)">'+STABS[i]+'</button>';
  }
  h+='</div>';
  if(PTAB===0) h+=rJugadores();
  if(PTAB===1) h+=rRoles();
  if(PTAB===2) h+=rVariantes();
  el.innerHTML=h;
}
function setPTAB(btn){ PTAB=parseInt(btn.dataset.ti); rPlantilla(); }

function rJugadores(){
  var nf=ROSTER.squad.length, nb=ROSTER.bench.length, nc=POOL.length-nf-nb;

  h+='<button class="btn-n btn-sm" onclick="importRoster()" style="font-size:8px;letter-spacing:1px">&#8595; IMPORTAR TODO</button>';
  h+='</div>';
  h+='<div style="display:flex;gap:6px">';
  h+='<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:8px;padding:6px 10px;text-align:center"><div style="font-size:18px;font-weight:900;color:var(--g);font-family:monospace">'+nf+'</div><div style="font-size:7px;color:var(--g);font-weight:700;letter-spacing:1px">CAMPO</div></div>';
  h+='<div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:8px;padding:6px 10px;text-align:center"><div style="font-size:18px;font-weight:900;color:#a16207;font-family:monospace">'+nb+'</div><div style="font-size:7px;color:#a16207;font-weight:700;letter-spacing:1px">BQUILLO</div></div>';
  h+='<div style="background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:8px;padding:6px 10px;text-align:center"><div style="font-size:18px;font-weight:900;color:#64748b;font-family:monospace">'+nc+'</div><div style="font-size:7px;color:#64748b;font-weight:700;letter-spacing:1px">NO CONV</div></div>';

  var posOrder=['GK','DEF','MID','FWD'];

      var stc=inf?'st-f':ben?'st-b':'st-o', stt=inf?'CAMPO':ben?'BANQUILLO':'NO CONV.';
      var myR=ROSTER.roles[p.id]||{}, rks=Object.keys(myR).filter(function(k){return myR[k]>0;});
      var rpips='';
      for(var ri=0;ri<Math.min(rks.length,3);ri++){
        rpips+='<span style="font-size:7px;color:var(--a);background:#fffbeb;border:1px solid #fde68a;padding:1px 5px;border-radius:3px;margin-right:2px">'+rks[ri].toUpperCase().replace('_','-')+'</span>';
      }
      h+='<div class="'+cls+'" data-pid="'+p.id+'" onclick="cyclePlayer(this)">';
      h+='<div class="pt-top"><span class="pt-num">#'+p.num+'</span>';
      h+='<button class="pt-edit" data-pid="'+p.id+'" onclick="event.stopPropagation();openEditP(this)">&#9998;</button></div>';
      h+='<div class="pt-name">'+p.nick+'</div>';
      h+='<span class="pt-pos pos-'+p.pos+'">'+p.pos+'</span>';

function rRoles(){

  var conv=[];
  for(var i=0;i<POOL.length;i++) if(convIds.indexOf(POOL[i].id)>=0) conv.push(POOL[i]);
  conv.sort(function(a,b){return a.num-b.num;});
  var pcdR=RDEFS.filter(function(r){return r.grp==='D';});
  var pcaR=RDEFS.filter(function(r){return r.grp==='A';});
  function buildT(rdefs, color){
    var h='<div style="overflow-x:auto;margin-bottom:16px"><table class="roles-tbl"><thead><tr><th>JUGADOR</th>';

    for(var ci=0;ci<conv.length;ci++){

        h+='<td>'+(rank>0?'<span class="rk rk'+rank+'" data-pid="'+p.id+'" data-rid="'+r.id+'" onclick="cycleRank(this)">R'+rank+'</span>':

  h+='<span class="lbl" style="color:var(--a)">DEFENSA PC</span>'+buildT(pcdR,'var(--a)');

// PROGRAMACION
// ══════════════════════════════════════════════════
function rProg(){
  rQSel();
  rTimeline();
}
function rQSel(){
  var el=document.getElementById('qsel'); if(!el) return;
  var qs=MATCH.mirror?[1,2]:[1,2,3,4];
  var h='';
  for(var i=0;i<qs.length;i++){
    var q=qs[i], a=MATCH.curQ===q;
    var lbl='Q'+q+(MATCH.mirror&&q===1?' =Q3':MATCH.mirror&&q===2?' =Q4':'');
    h+='<button class="qsbtn'+(a?' qsbtn-a':'')+'" data-q="'+q+'" onclick="setQ(this)">'+lbl+'</button>';
  }
  el.innerHTML=h;
  var mb=document.getElementById('mir-btn');
  if(mb){ mb.className='mir-btn'+(MATCH.mirror?'':' mir-off'); mb.textContent=MATCH.mirror?'Q1=Q3 Q2=Q4':'SIN ESPEJO'; }
  var pi=document.getElementById('prog-info');
  if(pi){ var nj=MATCH.pairs.filter(function(p){return p.cd>0;}).length, nd=MATCH.pairs.length-nj; pi.textContent=nj+' cambios en juego'+(nd?' + '+nd+' en descansos':''); }
}
function setQ(btn){ MATCH.curQ=parseInt(btn.dataset.q); rProg(); }
function toggleMir(){ MATCH.mirror=!MATCH.mirror; if(MATCH.curQ>2&&MATCH.mirror)MATCH.curQ=1; rProg(); }

function rTimeline(){
  var el=document.getElementById('prog-body'); if(!el) return;
  var q=MATCH.curQ;
  var qP=MATCH.pairs.filter(function(p){return p.q===q;});
  var byMin={};
  for(var i=0;i<qP.length;i++){var p=qP[i];if(!byMin[p.cd])byMin[p.cd]=[];byMin[p.cd].push(p);}
  var h='';
  if(MATCH.importInfo){
    var ii=MATCH.importInfo;
    h+='<div style="background:#f0fdf4;border:1.5px solid rgba(22,163,74,.35);border-radius:8px;padding:7px 12px;margin-bottom:10px;font-size:9px;color:var(--t2)">'+
       '<b style="color:var(--g);letter-spacing:1px">IMPORTADO DE EXCEL</b> &middot; '+impEsc(ii.title||ii.file)+' &middot; '+ii.n+' cambios en juego</div>';
  }
  // INICIO DE CUARTO
  if(q>1){
    var sp=byMin[0]||[];
    h+='<span class="lbl" style="color:var(--r)">INICIO Q'+q+' — AUTO AL FINALIZAR Q'+(q-1)+'</span>';
    h+='<div class="tl-start">';
    if(sp.length){
      for(var i=0;i<sp.length;i++){
        var p=sp[i],pO=gP(p.out),pI=gP(p.inp);
        h+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(200,16,46,.12)">';
        h+='<span style="font-size:9px;font-weight:800;color:var(--r);min-width:58px">INICIO Q'+q+'</span>';
        h+='<span class="chg-out">SALE #'+(pO?pO.num:'?')+' '+(pO?pO.nick:'')+'</span>';
        h+='<span class="chg-arr">&#8594;</span>';
        h+='<span class="chg-in">ENTRA #'+(pI?pI.num:'?')+' '+(pI?pI.nick:'')+'</span>';
        h+='<button class="chg-del" data-pid="'+p.id+'" onclick="delPair(this)">x</button></div>';
      }
    } else {
      h+='<div style="font-size:10px;color:var(--t2)">Sin cambios de inicio</div>';
    }
    h+='<button onclick="openPairMod('+q+',0)" style="margin-top:8px;background:none;border:1.5px solid rgba(200,16,46,.4);color:var(--r);padding:5px 12px;font-size:9px;font-weight:800;border-radius:6px;cursor:pointer">+ ANADIR</button>';
    h+='</div>';

    // 11 INICIAL explicit selector for Q2/Q3/Q4
    var qsi=MATCH.qStart&&MATCH.qStart[q]?MATCH.qStart[q]:null;
    var qsiCount=qsi?qsi.length:0;
    h+='<span class="lbl" style="color:var(--b);margin-top:10px">11 INICIAL Q'+q+' <span style="font-size:8px;font-weight:600;color:var(--t2)">(base para calcular cambios)</span></span>';
    h+='<div style="background:#eff6ff;border:1.5px solid rgba(37,99,235,.3);border-radius:10px;padding:10px 12px;margin-bottom:10px">';
    if(qsi){
      h+='<div style="font-size:9px;color:var(--b);font-weight:700;margin-bottom:8px">'+qsiCount+' jugadores definidos</div>';
      var allConvQ=ROSTER.squad.concat(ROSTER.bench);
      for(var qi=0;qi<qsi.length;qi++){
        var qp=gP(qsi[qi]);
        h+='<span style="display:inline-block;background:var(--b);color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;margin:2px">'+
           '#'+(qp?qp.num:'?')+' '+(qp?qp.nick:'')+'</span>';
      }
      h+='<div style="display:flex;gap:6px;margin-top:8px">'+
         '<button onclick="openQStart('+q+')" style="background:var(--b);border:none;color:#fff;padding:5px 12px;font-size:9px;font-weight:800;border-radius:6px;cursor:pointer">EDITAR</button>'+
         '<button data-q="'+q+'" onclick="clearQStart(this)" style="background:none;border:1.5px solid var(--bd);color:var(--t2);padding:5px 12px;font-size:9px;font-weight:700;border-radius:6px;cursor:pointer">BORRAR (usar auto)</button>'+
         '</div>';
    } else {
      h+='<div style="font-size:9px;color:var(--t2);margin-bottom:8px">No definido — se calcula automaticamente desde el estado anterior</div>';
      h+='<button onclick="openQStart('+q+')" style="background:var(--b);border:none;color:#fff;padding:5px 12px;font-size:9px;font-weight:800;border-radius:6px;cursor:pointer">DEFINIR 11 INICIAL</button>';
    }
    h+='</div>';
  }
  // TIMELINE
  // Mirror indicator
  if(MATCH.mirror){
    if(q<=2){
      h+='<div style="background:#f0fdf4;border:1.5px solid rgba(22,163,74,.35);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px">';
      h+='<span style="font-size:16px">&#8644;</span>';
      h+='<div><div style="font-size:9px;font-weight:800;color:var(--g);letter-spacing:1px">ESPEJO ACTIVO</div>';
      h+='<div style="font-size:9px;color:var(--t2)">Q'+q+' se replica automaticamente en Q'+(q+2)+'. Los cambios que programes aqui se ejecutaran tambien en Q'+(q+2)+'.</div></div></div>';
    } else {
      h+='<div style="background:#fffbeb;border:1.5px solid rgba(245,158,11,.4);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px">';
      h+='<span style="font-size:16px">&#8644;</span>';
      h+='<div><div style="font-size:9px;font-weight:800;color:var(--a);letter-spacing:1px">MODO ESPEJO — Q'+(q-2)+' &#8594; Q'+q+'</div>';
      h+='<div style="font-size:9px;color:var(--t2)">Este cuarto replica Q'+(q-2)+'. Desactiva el espejo si quieres programar Q'+q+' de forma independiente.</div></div></div>';
    }
  }
  h+='<span class="lbl">TIMELINE Q'+q+'</span>';
  h+='<div class="tl-bar">';
  for(var cd=14;cd>=1;cd--){
    var cnt=(byMin[cd]||[]).length, has=cnt>0;
    h+='<div class="tl-min'+(has?' tl-has':'')+'" data-q="'+q+'" data-cd="'+cd+'" onclick="openPairModEl(this)">';
    h+='<div class="tl-min-cd">'+pad2(cd)+':00</div>';
    if(has) h+='<div class="tl-min-n">'+cnt+'x</div>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:7px;color:var(--t3);margin-bottom:10px"><span>INICIO Q'+q+'</span><span>FIN Q'+q+'</span></div>';
  // LIST

function addPair(btn){

function delPair(btn){

function fieldAt(q,cd){
  // If an explicit qStart is defined for this quarter, use it as base
  // and only apply pairs from that quarter onwards
  var field;
  var startQ=q;
  if(MATCH.qStart&&MATCH.qStart[q]){
    field=MATCH.qStart[q].slice();
    startQ=q; // only apply pairs from this quarter
  } else if(q>1){
    // Walk back to find the nearest defined qStart
    for(var bq=q-1;bq>=1;bq--){
      if(bq===1){field=(MATCH.qStart&&MATCH.qStart[1])?MATCH.qStart[1].slice():ROSTER.squad.slice();startQ=1;break;}
      if(MATCH.qStart&&MATCH.qStart[bq]){field=MATCH.qStart[bq].slice();startQ=bq;break;}
    }
  } else {
    field=ROSTER.squad.slice();
    startQ=1;
  }
  var sorted=MATCH.pairs.slice().sort(function(a,b){
    if(a.q!==b.q) return a.q-b.q;
    if(a.cd===0&&b.cd!==0) return -1;
    if(b.cd===0&&a.cd!==0) return 1;
    return b.cd-a.cd;
  });
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i];
    // Only apply pairs from startQ onwards
    if(p.q<startQ) continue;
    var before=(p.q<q)||(p.q===q&&p.cd===0)||(p.q===q&&cd!==0&&p.cd>cd);
    if(before){var oi=field.indexOf(p.out);if(oi>=0){field.splice(oi,1);if(field.indexOf(p.inp)<0)field.push(p.inp);}}
  }
  return field;
}

function getQ(){ return isQ()?qNum():1; }
function getE(){ return isQ()?MATCH.qElapsed:0; }

function allPending(q,elapsed){
  var result=[], srcQ=(MATCH.mirror&&(q===3||q===4))?q-2:q;
  for(var i=0;i<MATCH.pairs.length;i++){
    var p=MATCH.pairs[i]; if(p.q!==srcQ||p.cd===0) continue;
    var mk=(q===3?'m3_':q===4?'m4_':'')+p.id;
    var ek=(q===3||q===4)?mk:String(p.id);
    if(MATCH.execIds.indexOf(ek)>=0) continue;
    result.push({pairId:p.id,out:p.out,inp:p.inp,cd:p.cd,mk:(q===3||q===4)?mk:'',sl:(15-p.cd)*60-elapsed});
  }
  result.sort(function(a,b){return b.cd-a.cd;});
  return result;
}

var _rolesCache={};
function buildRolesByRole(){
  var rdefs=RDEFS;

  for(var i=0;i<rdefs.length;i++) byRole[rdefs[i].id]=[];
  for(var i=0;i<ROSTER.squad.length;i++){
    var pid=ROSTER.squad[i], p=gP(pid); if(!p) continue;
    var roles=ROSTER.roles[pid]||{};
    for(var j=0;j<rdefs.length;j++){
      var rid=rdefs[j].id, rank=roles[rid]||0;
      if(rank>0) byRole[rid].push({p:p,rank:rank});
    }

  for(var k in byRole) byRole[k].sort(function(a,b){return a.rank-b.rank;});

function buildRolesRows(list,color,byRole){

function buildField(){

function buildBench(){
  var bench=ROSTER.bench.filter(function(id){return ROSTER.squad.indexOf(id)<0;});
  if(!bench.length) return '';
  var pend=allPending(getQ(),getE());
  var pendIn=[];
  for(var i=0;i<pend.length;i++) pendIn.push(pend[i].inp);
  bench.sort(function(a,b){
    var pa=gP(a),pb=gP(b);
    var po=['GK','DEF','MID','FWD'];
    var ia=po.indexOf(pa?pa.pos:'FWD'), ib=po.indexOf(pb?pb.pos:'FWD');
    return ia!==ib?ia-ib:(pa?pa.num:0)-(pb?pb.num:0);
  });
  var posC={GK:'#7c3aed',DEF:'var(--b)',MID:'var(--g)',FWD:'var(--r)'};
  var h='<div class="bench-box"><div class="bench-hdr">BANQUILLO ('+bench.length+')</div>';
  for(var i=0;i<bench.length;i++){
    var id=bench[i], p=gP(id); if(!p) continue;
    var isPend=pendIn.indexOf(id)>=0;
    h+='<div class="bench-row" style="'+(isPend?'background:#f0fdf4;border-left:3px solid var(--g)':'')+'">';
    h+='<span class="bench-num" style="color:'+(posC[p.pos]||'var(--r)')+'">'+p.num+'</span>';
    h+='<span class="bench-name">'+p.nick+'</span>';
    h+='<span class="pt-pos pos-'+p.pos+'">'+p.pos+'</span>';
    if(isPend) h+='<span class="bench-in">ENTRA</span>';

}

// ── EXEC PAIR ──
function execBtn(btn){ execPair(parseInt(btn.dataset.pid), btn.dataset.mk||''); }
function execPair(pairId, mk){
  var srcId=mk?parseInt(mk.replace('m3_','').replace('m4_','')):pairId;
  var pair=null;
  for(var i=0;i<MATCH.pairs.length;i++) if(MATCH.pairs[i].id===srcId){pair=MATCH.pairs[i];break;}
  if(!pair) return;
  var ek=mk||String(pairId);
  if(MATCH.execIds.indexOf(ek)>=0) return;
  MATCH.execIds.push(ek);
  // Move out -> bench, in -> squad
  var oi=ROSTER.squad.indexOf(pair.out);
  if(oi>=0){
    ROSTER.squad.splice(oi,1);
    if(ROSTER.bench.indexOf(pair.out)<0) ROSTER.bench.push(pair.out);
  }
  var bi=ROSTER.bench.indexOf(pair.inp);
  if(bi>=0) ROSTER.bench.splice(bi,1);
  if(ROSTER.squad.indexOf(pair.inp)<0) ROSTER.squad.push(pair.inp);
  // Transfer position
  if(MATCH.pos[pair.out]) MATCH.pos[pair.inp]={x:MATCH.pos[pair.out].x,y:MATCH.pos[pair.out].y};
  MATCH.log.push({type:'sub',sec:MATCH.matchTime,wall:Date.now(),outId:pair.out,inId:pair.inp});
  var pO=gP(pair.out), pI=gP(pair.inp);
  toast('CAMBIO: #'+(pO?pO.num:'?')+' '+(pO?pO.nick:'')+' > #'+(pI?pI.num:'?')+' '+(pI?pI.nick:''),'ok');
  save(); if(CUR===2) rPartido();
}

function confirmCard(btn){

    '<button class="btn-n" style="width:100%" data-pid="'+pid+'" data-type="'+type+'" data-secs="'+secs+'" data-dec="cambio" onclick="confirmCardDecision(this)">EJECUTAR CAMBIO PROGRAMADO</button>'+

function confirmCardDecision(btn){
  var pid=parseInt(btn.dataset.pid), type=btn.dataset.type, secs=parseInt(btn.dataset.secs), dec=btn.dataset.dec;
  var p=gP(pid);

  // Find own pending pair if decision is 'cambio'
  var pairId=null, mk='';
  if(dec==='cambio'){
    var pend=allPending(getQ(),getE());
    for(var i=0;i<pend.length;i++) if(pend[i].out===pid){pairId=pend[i].pairId;mk=pend[i].mk||'';break;}
    if(pairId===null){
      toast('Sin cambio programado, se aplicara REGRESA AL CAMPO','warn');
      dec='regresa';
    }
  }

  // Remove from squad -> penalty box
  var si=ROSTER.squad.indexOf(pid);
  if(si>=0) ROSTER.squad.splice(si,1);

  MATCH.pb.push({id:pid, type:type, secLeft:secs, dec:dec, pairId:pairId, mk:mk, started:false});
  MATCH.events.push({id:Date.now(), lbl:(type==='verde'?'T.Verde ':'T.Amarilla ')+(p?p.name:pid), start:Math.max(0,MATCH.matchTime), end:MATCH.matchTime+secs});

  closeMod();
  toast('Tarjeta '+(type==='verde'?'VERDE':'AMARILLA')+' #'+(p?p.num:'?')+' - '+(dec==='cambio'?'cambio al cumplirse':'regresa al campo'),'warn');
  save(); if(CUR===2) rPartido();
}
function applyRedCard(pid){
  var p=gP(pid);
  var si=ROSTER.squad.indexOf(pid);
  if(si>=0) ROSTER.squad.splice(si,1);
  MATCH.expelled.push(pid);

  // Remove future pairs (current Q and later) where this player is out or inp
  var q=getQ();
  var removed=0;
  MATCH.pairs = MATCH.pairs.filter(function(pr){
    var involves = (pr.out===pid||pr.inp===pid);
    var isFuture = pr.q>q || (pr.q===q);
    if(involves && isFuture){removed++; return false;}
    return true;
  });

  MATCH.events.push({id:Date.now(), lbl:'T.Roja '+(p?p.name:pid), start:Math.max(0,MATCH.matchTime), end:MATCH.matchTime+1});
  var msg='TARJETA ROJA #'+(p?p.num:'?')+' '+(p?p.nick:'')+' - expulsion definitiva. Equipo con '+ROSTER.squad.length+'.';
  if(removed>0) msg+=' '+removed+' cambio(s) programados eliminados.';
  toast(msg,'urgent');
  save(); if(CUR===2) rPartido();
}

// ── TIMER ──
function startTmr(){
  clearInterval(tiInt); if(!MATCH.running) return;
  tiInt=setInterval(function(){
    if(isBk()){
      MATCH.breakCd--;
      if(MATCH.breakCd<=0){MATCH.running=false;MATCH.breakCd=0;clearInterval(tiInt);}
    } else if(isQ()){
      MATCH.qElapsed++;MATCH.matchTime++;
      if(MATCH.qElapsed>=QD){autoEndQ();return;}
      checkAlerts();
      checkPBTimers();
    }
    rHdr();
    if(CUR===2) rPartido();
  },1000);
}
function stopTmr(){ clearInterval(tiInt); }

function startQ(){
  if(MATCH.phase==='pre'){
    MATCH.log=[{type:'init',ids:ROSTER.squad.slice(),sec:0}];
    MATCH.execIds=[];MATCH.alerted={};MATCH.events=[];
    MATCH.score={h:0,a:0};MATCH.matchTime=0;MATCH.qElapsed=0;MATCH.qLog=[];
    MATCH.posDragged={};MATCH.pb=[];MATCH.expelled=[];
    MATCH.videoStartAt=Date.now();
    if(!MATCH.qStart) MATCH.qStart={1:null,2:null,3:null,4:null};
    MATCH.qStart[1]=ROSTER.squad.slice();  // 11 inicial real: base fija para fieldAt
    var sh=document.getElementById('sc-h');if(sh)sh.textContent='0';
    var sa=document.getElementById('sc-a');if(sa)sa.textContent='0';
  }
  hideBrk();
  MATCH.phase='q1';MATCH.qElapsed=0;MATCH.running=true;
  MATCH.qWallStart=Date.now();
  startTmr();rHdr();if(CUR===2)rPartido();
}
function startNextQ(){
  var nq={b12:'q2',b23:'q3',b34:'q4'}[MATCH.phase]; if(!nq) return;
  hideBrk();
  MATCH.phase=nq;MATCH.qElapsed=0;MATCH.running=true;
  MATCH.qWallStart=Date.now();
  startTmr();rHdr();if(CUR===2)rPartido();
}
function pauseG(){MATCH.running=false;stopTmr();rHdr();if(CUR===2)rPartido();}
function resumeG(){MATCH.running=true;startTmr();rHdr();if(CUR===2)rPartido();}

function endQ(){
  stopTmr();MATCH.running=false;
  MATCH.qLog.push({num:qNum(),start:MATCH.matchTime-MATCH.qElapsed,end:MATCH.matchTime,wallStart:MATCH.qWallStart||MATCH.videoStartAt,wallEnd:Date.now()});
  var nxt={q1:'b12',q2:'b23',q3:'b34',q4:'ended'}[MATCH.phase];
  if(nxt==='ended'){MATCH.phase='ended';rHdr();if(CUR===2)rPartido();return;}
  var nqn={b12:2,b23:3,b34:4}[nxt];
  execInitPairs(nqn);
  MATCH.breakCd=BREAKS[nxt];MATCH.phase=nxt;MATCH.qElapsed=0;MATCH.running=true;
  showBrk(nxt,nqn);
  startTmr();rHdr();if(CUR===2)rPartido();
}
function autoEndQ(){
  stopTmr();MATCH.running=false;
  MATCH.qLog.push({num:qNum(),start:MATCH.matchTime-QD,end:MATCH.matchTime,wallStart:MATCH.qWallStart||MATCH.videoStartAt,wallEnd:Date.now()});
  var nxt={q1:'b12',q2:'b23',q3:'b34',q4:'ended'}[MATCH.phase];
  if(nxt==='ended'){MATCH.phase='ended';rHdr();if(CUR===3)rInforme();else go(3);return;}
  var nqn={b12:2,b23:3,b34:4}[nxt];
  execInitPairs(nqn);
  MATCH.breakCd=BREAKS[nxt];MATCH.phase=nxt;MATCH.qElapsed=0;MATCH.running=true;
  showBrk(nxt,nqn);
  startTmr();rHdr();if(CUR===2)rPartido();
}
function execInitPairs(nqn){
  var initP=MATCH.pairs.filter(function(p){return p.q===nqn&&p.cd===0;});
  if(!initP.length) return;

  // Reconstruct correct end-of-previous-quarter state using fieldAt
  // so unexecuted Q pairs don't cause squad/bench inconsistency
  var prevQ=nqn-1;
  var correctField=fieldAt(prevQ,1);
  var allConv=[];
  for(var i=0;i<POOL.length;i++){
    var pid=POOL[i].id;
    if(ROSTER.squad.indexOf(pid)>=0||ROSTER.bench.indexOf(pid)>=0) allConv.push(pid);
  }
  ROSTER.squad=correctField.filter(function(id){return allConv.indexOf(id)>=0;});
  ROSTER.bench=allConv.filter(function(id){return ROSTER.squad.indexOf(id)<0;});

  // Apply inicio pairs on corrected state
  // After fieldAt reconstruction, squad/bench is fully consistent —
  // so we can trust indexOf results. Skip pairs where out is not in squad.
  var cnt=0;
  for(var i=0;i<initP.length;i++){
    var p=initP[i];
    var oi=ROSTER.squad.indexOf(p.out);
    if(oi<0) continue; // out not in field - pair already invalid, skip
    ROSTER.squad.splice(oi,1);
    if(ROSTER.bench.indexOf(p.out)<0) ROSTER.bench.push(p.out);
    var bi=ROSTER.bench.indexOf(p.inp); if(bi>=0) ROSTER.bench.splice(bi,1);
    if(ROSTER.squad.indexOf(p.inp)<0) ROSTER.squad.push(p.inp);
    if(MATCH.pos[p.out]) MATCH.pos[p.inp]={x:MATCH.pos[p.out].x,y:MATCH.pos[p.out].y};
    MATCH.log.push({type:'sub',sec:MATCH.matchTime,wall:Date.now(),outId:p.out,inId:p.inp,sit:'inicio_q'+nqn});
    MATCH.execIds.push(String(p.id));
    cnt++;
  }
  if(cnt>0) toast(cnt+' cambios inicio Q'+nqn+' ejecutados','ok');
}

// ── PLAYED TIME ──
function playedTime(id){
  var t=0,inF=false,last=0;
  var init=null;
  for(var i=0;i<MATCH.log.length;i++) if(MATCH.log[i].type==='init'){init=MATCH.log[i];break;}
  if(init&&init.ids&&init.ids.indexOf(id)>=0){inF=true;last=0;}
  for(var i=0;i<MATCH.log.length;i++){
    var e=MATCH.log[i]; if(e.type!=='sub') continue;
    if(e.outId===id&&inF){t+=e.sec-last;inF=false;last=e.sec;}
    if(e.inId===id&&!inF){inF=true;last=e.sec;}
  }
  if(inF) t+=MATCH.matchTime-last;
  return t;
}
function effectiveTime(id){
  // matchTime only increments when the game is RUNNING (not paused).
  // Any interruption (GOL, PC, tarjeta, lesion, video umpire...) stops
  // the timer via PAUSA, so matchTime already reflects effective play time.
  // effectiveTime = playedTime measured in matchTime = same as playedTime().
  return playedTime(id);
}

var _D={id:null,el:null,fw:null,moved:false};
function tokTS(e){
  if(e.cancelable) e.preventDefault();
  var el=e.currentTarget;
  _D.id=parseInt(el.dataset.pid);
  _D.el=el;_D.moved=false;
  _D.fw=document.getElementById('fw');
  el.style.zIndex='20';
}
document.addEventListener('touchmove',function(e){
  if(_D.id===null||!_D.fw) return;
  if(e.cancelable) e.preventDefault();
  _D.moved=true;
  var t=e.touches[0], fr=_D.fw.getBoundingClientRect();
  var x=t.clientX-fr.left-_D.el.offsetWidth/2;
  var y=t.clientY-fr.top-_D.el.offsetHeight/2;
  var px=Math.max(0,Math.min(fr.width-_D.el.offsetWidth,x));
  var py=Math.max(0,Math.min(fr.height-_D.el.offsetHeight,y));
  _D.el.style.left=px+'px';
  _D.el.style.top=py+'px';
  MATCH.pos[_D.id]={x:Math.round((px+_D.el.offsetWidth/2)/fr.width*100),y:Math.round((py+_D.el.offsetHeight/2)/fr.height*100)};
  MATCH.posDragged[_D.id]=1;
},{passive:false});
document.addEventListener('touchend',function(){
  if(_D.id===null) return;
  if(!_D.moved) tapTok(_D.el);
  _D.el.style.zIndex='';
  _D.id=null;_D.el=null;_D.fw=null;
  save();
});

function exportCSV(){

function exportXML(){
  var vStart=MATCH.videoStartAt||0;
  function vt(wall){ return vStart>0 ? parseFloat(((wall-vStart)/1000).toFixed(3)) : 0; }
  function vtSec(sec){ return parseFloat(sec.toFixed(3)); }

  // Build quarter video boundaries for segment splitting
  var qBounds=[]; // [{s,e}] video time per quarter
  for(var i=0;i<MATCH.qLog.length;i++){
    var q=MATCH.qLog[i];
    qBounds.push({
      s: q.wallStart ? vt(q.wallStart) : vtSec(q.start),
      e: q.wallEnd   ? vt(q.wallEnd)   : vtSec(q.end)
    });
  }

  // Split a single [segS,segE] video-time segment across quarter boundaries
  function splitByQ(segS, segE){
    if(!qBounds.length) return [{s:segS,e:segE}];
    var result=[];
    for(var qi=0;qi<qBounds.length;qi++){
      var qs=qBounds[qi].s, qe=qBounds[qi].e;
      var is=Math.max(segS,qs), ie=Math.min(segE,qe);
      if(is<ie) result.push({s:parseFloat(is.toFixed(3)),e:parseFloat(ie.toFixed(3))});
    }
    return result.length ? result : [{s:segS,e:segE}];
  }

  var iid=1, lines=['<file>','<ALL_INSTANCES>'];
  var conv=ROSTER.squad.concat(ROSTER.bench);
  for(var ci=0;ci<conv.length;ci++){
    var id=conv[ci], segs=[], inF=false, seg=null, segW=null, init=null;
    for(var i=0;i<MATCH.log.length;i++) if(MATCH.log[i].type==='init'){init=MATCH.log[i];break;}
    if(init&&init.ids&&init.ids.indexOf(id)>=0){inF=true;seg=0;segW=vStart;}

  a.href=url;a.download='Logs-'+new Date().toISOString().slice(0,10)+'_ESP-'+ROSTER.rival+'.xml';
  a.click();URL.revokeObjectURL(url);

function impNorm(s){
  s=String(s==null?'':s).toUpperCase();
  if(s.normalize) s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');

}

// ── ZIP (.xlsx) sin dependencias ──
function impInflate(method,data){

  if(method!==8) return Promise.reject(new Error('Compresion del .xlsx no soportada'));
  if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('Este navegador no puede abrir .xlsx. Actualiza iPadOS o guarda la hoja como CSV.'));
  var stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).text();
}
function impUnzip(buf){

  if(eocd<0) return Promise.reject(new Error('El archivo no es un .xlsx valido'));
  var n=dv.getUint16(eocd+10,true), off=dv.getUint32(eocd+16,true), files={}, jobs=[], td=new TextDecoder();
  function keep(nm){ return function(t){ files[nm]=t; }; }
  for(var k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    var method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true);
    var nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true);
    var loff=dv.getUint32(off+42,true);
    var name=td.decode(u8.subarray(off+46,off+46+nlen));
    off+=46+nlen+elen+clen;
    if(!/^xl\/(workbook\.xml|sharedStrings\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^\/]+\.xml)$/.test(name)) continue;
    var lnl=dv.getUint16(loff+26,true), lel=dv.getUint16(loff+28,true), ds=loff+30+lnl+lel;
    jobs.push(impInflate(method,u8.subarray(ds,ds+csize)).then(keep(name)));

}
function impSST(xml){

    var t='', r2=/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g, mm;

}
function impColIdx(ref){

}
function impSheetGrid(xml,sst){

    var at=m[1], rm=/\br="([A-Z]+)(\d+)"/.exec(at); if(!rm) continue;

    var val=grid[r0]?grid[r0][c0]:null; if(val===null||val===undefined) continue;

function impSheets(files){

function impCSVGrid(txt){
  txt=txt.replace(/^﻿/,'');
  var first=txt.split(/\r?\n/)[0]||'';
  var sep=(first.split(';').length>first.split(',').length)?';':(first.indexOf('\t')>=0?'\t':',');
  var grid=[], row=[], cur='', q=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charAt(i);
    if(q){
      if(ch==='"'){ if(txt.charAt(i+1)==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    } else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&txt.charAt(i+1)==='\n') i++;
      row.push(cur); grid.push(row); row=[]; cur='';

// ── Lectura de la estructura ──
function impGrpPos(label){
  var n=impNorm(label);
  if(/PORTER|GOALK|^GK/.test(n)) return 'GK';
  if(/CENTRAL|LATERAL|DEFENS|CARRIL|LIBERO|DEF/.test(n)) return 'DEF';
  if(/MEDIO|VOLANT|INTERIOR|MEDIOC|MID/.test(n)) return 'MID';
  if(/DELANT|ATAC|ATAQ|PUNTA|EXTREM|FWD|FORW/.test(n)) return 'FWD';
  return null;
}
function impOn(v){
  if(v===1||v===true) return true;
  if(typeof v==='number') return v>0;
  var n=impNorm(v); return n==='1'||n==='X'||n==='SI';
}
function impAnalyze(grid){
  var R=grid.length, minR=-1, minC=-1;
  for(var r=0;r<R&&minR<0;r++){
    var row=grid[r]||[];
    for(var c=0;c<row.length;c++){
      if(typeof row[c]==='string'&&/^MIN/.test(impNorm(row[c]))){minR=r;minC=c;break;}
    }
  }
  if(minR<0) throw new Error('No encuentro la fila "MIN." con los nombres de los jugadores.');
  var nrow=grid[minR], cols=[];
  for(var c=0;c<nrow.length;c++){
    if(c===minC) continue;
    var v=nrow[c]; if(v===undefined||v===null) continue;
    var s=String(v).trim(), n=impNorm(s);
    if(!n||/^(MIN|POS)/.test(n)||/^\d+$/.test(n)) continue;
    cols.push({c:c,name:s.toUpperCase()});
  }
  if(cols.length<8) throw new Error('Solo encuentro '+cols.length+' jugadores en la fila de nombres.');
  // fila de lineas (CENTRALES / LATERALES / MEDIOS / DELANTEROS)
  var gR=-1;
  for(var r=minR-1;r>=0&&gR<0;r--){
    var row=grid[r]||[];
    for(var k=0;k<cols.length;k++){
      var gv=row[cols[k].c];
      if(typeof gv==='string'&&impGrpPos(gv)&&/CENTRAL|LATERAL|MEDIO|DELANT|DEFENS|ATAC|PORTER|VOLANT|INTERIOR|EXTREM/.test(impNorm(gv))){gR=r;break;}
    }
  }
  var last=null;
  for(var k=0;k<cols.length;k++){
    var g=gR>=0?(grid[gR]||[])[cols[k].c]:null;
    if(typeof g==='string'&&g.trim()) last=g.trim().toUpperCase();
    cols[k].grp=last||'CAMPO';
    cols[k].pos=impGrpPos(cols[k].grp);
  }
  // filas de rol tactico (DEF / AT)
  var tac={}, top=gR>=0?gR:minR;
  for(var r=0;r<top;r++){
    var row=grid[r]||[], lab=null;
    for(var c=0;c<cols[0].c;c++){ if(typeof row[c]==='string'){ lab=impNorm(row[c]); break; } }
    if(!lab) continue;
    var kind=(lab==='DEF'||lab==='DEFENSA')?'def':(lab==='AT'||lab==='ATAQUE'||lab==='ATQ')?'at':null;
    if(!kind) continue;
    for(var k=0;k<cols.length;k++){
      var tv=row[cols[k].c];
      if(tv!==undefined&&tv!==null&&String(tv).trim()){
        if(!tac[cols[k].name]) tac[cols[k].name]={};
        tac[cols[k].name][kind]=String(tv).trim().toUpperCase().replace(/CENTTRAL/g,'CENTRAL');
      }
    }
  }
  // titulo y rival
  var title='';
  for(var r=0;r<top&&!title;r++){
    var row=grid[r]||[];
    for(var c=0;c<row.length;c++){ if(typeof row[c]==='string'&&/\bVS\.?\b|\s-\s/i.test(row[c])&&row[c].length>8){title=row[c].trim();break;} }
  }
  if(!title){ var r0=grid[0]||[]; for(var c=0;c<r0.length;c++) if(typeof r0[c]==='string'){title=r0[c].trim();break;} }
  var rival=impRival(title);
  // bloques de minutos
  var blocks=[], cur=null, prevMin=null;
  var useCols=cols.filter(function(x){return x.pos!=='GK';});
  for(var r=minR+1;r<R;r++){
    var row=grid[r]||[], mv=row[minC];
    var mn=(typeof mv==='number')?mv:(typeof mv==='string'&&/^\d+$/.test(mv.trim())?parseInt(mv,10):NaN);
    if(isNaN(mn)||mn<0||mn>15||Math.floor(mn)!==mn){ cur=null; prevMin=null; continue; }
    if(!cur||prevMin===null||mn>=prevMin){ cur=[]; blocks.push(cur); }
    var on=[];
    for(var k=0;k<useCols.length;k++) if(impOn(row[useCols[k].c])) on.push(useCols[k].name);
    cur.push({min:mn,on:on,row:r+1});
    prevMin=mn;
  }
  blocks=blocks.filter(function(b){return b.length>=2;});
  if(!blocks.length) throw new Error('No encuentro bloques de minutos (15 a 1).');
  if(blocks.length===3||blocks.length>4) throw new Error('Encuentro '+blocks.length+' bloques de minutos. Deben ser 1, 2 (Q1=Q3 y Q2=Q4) o 4.');
  for(var b=0;b<blocks.length;b++){
    var off=15-blocks[b][0].min;
    for(var i=0;i<blocks[b].length;i++) blocks[b][i].cd=blocks[b][i].min+off;
  }

  for(var kk in counts) if(counts[kk]>best){best=counts[kk];exp=parseInt(kk,10);}
  var errors=[], warns=[];
  if(exp!==10) warns.push('La Excel tiene '+exp+' jugadores de campo por minuto (lo normal son 10).');
  for(var b=0;b<blocks.length;b++) for(var i=0;i<blocks[b].length;i++){
    var rw=blocks[b][i];
    if(rw.on.length!==exp) errors.push(impBlkName(b,blocks.length)+' · minuto '+rw.min+' (fila '+rw.row+'): '+rw.on.length+' en campo en vez de '+exp);
  }
  return {title:title,rival:rival,cols:useCols,tac:tac,blocks:blocks,errors:errors,warns:warns};
}
function impBlkName(b,nb){
  if(nb===2) return b===0?'Q1/Q3':'Q2/Q4';
  if(nb===1) return 'Q1-Q4';
  return 'Q'+(b+1);
}
function impRival(title){
  if(!title) return null;
  var parts=title.split(/\bvs\.?\b|\bv\b|\s-\s/i);
  for(var i=0;i<parts.length;i++){
    var words=parts[i].trim().split(/\s+/);
    for(var s=0;s<words.length;s++){
      for(var len=Math.min(3,words.length-s);len>=1;len--){
        var key=impNorm(words.slice(s,s+len).join(''));
        if(IMP_SELF.indexOf(key)>=0) { s+=len-1; break; }
        if(IMP_CTRY[key]) return IMP_CTRY[key];
        if(len===1&&key.length===3&&FIH.indexOf(key)>=0) return key;
      }
    }
  }
  return null;
}

// ── Reconocimiento de jugadores ──
function impInitials(name){
  var ws=String(name).split(/[\s,]+/), s='';
  for(var i=0;i<ws.length;i++) if(ws[i]) s+=impNorm(ws[i]).charAt(0);
  return s;
}
function impMatch(name){
  var t=impNorm(name), conv=ROSTER.squad.concat(ROSTER.bench), cands=[], bs=0;
  for(var i=0;i<POOL.length;i++){
    var p=POOL[i]; if(p.pos==='GK') continue;
    var s=0, al=p.alias||[];
    if(impNorm(p.nick)===t) s=10;
    for(var a=0;a<al.length&&s<9;a++) if(impNorm(al[a])===t) s=9;
    if(!s){
      if(impNorm(p.name)===t) s=6;
      var ws=String(p.name).split(/[\s,]+/);
      for(var w=0;w<ws.length;w++) if(ws[w]&&impNorm(ws[w])===t) s=Math.max(s,5);
      if(!s&&t.length>=2&&t.length<=3&&impInitials(p.name)===t) s=3;
      if(!s&&t.length>=3){
        if(impNorm(p.nick).indexOf(t)===0) s=2;
        for(var w=0;w<ws.length;w++) if(ws[w]&&impNorm(ws[w]).indexOf(t)===0) s=Math.max(s,1);
      }
    }
    if(!s) continue;
    if(s>bs){bs=s;cands=[p];} else if(s===bs) cands.push(p);
  }
  if(cands.length>1){
    var cc=cands.filter(function(p){return conv.indexOf(p.id)>=0;});
    if(cc.length===1) cands=cc;
  }
  if(cands.length!==1) return null;
  return {id:cands[0].id, sure:bs>=5};
}

// ── Emparejamientos ──
function impDiff(a,b){ return a.filter(function(x){return b.indexOf(x)<0;}); }
function impSuggest(outs,ins,partner,tac){
  var ch={}, used={};

  for(var k=0;k<outs.length;k++){ var pi=partner[outs[k]]; if(pi&&ins.indexOf(pi)>=0&&!used[pi]) take(outs[k],pi); }
  var kinds=['at','def'];
  for(var kd=0;kd<kinds.length;kd++){
    for(var k=0;k<outs.length;k++){
      var o=outs[k]; if(ch[o]) continue;
      var to=(tac[o]||{})[kinds[kd]]; if(!to) continue;
      for(var j=0;j<ins.length;j++){ var i=ins[j]; if(!used[i]&&(tac[i]||{})[kinds[kd]]===to){ take(o,i); break; } }
    }
  }
  for(var k=0;k<outs.length;k++){
    if(ch[outs[k]]) continue;
    for(var j=0;j<ins.length;j++) if(!used[ins[j]]){ take(outs[k],ins[j]); break; }
  }

}
function impBuildTrans(){

  var partner={};
  function mk(key,label,cd,from,to){
    if(IMP.trans[key]) return;
    var outs=impDiff(from,to), ins=impDiff(to,from), byG={}, gl=[];
    for(var k=0;k<outs.length;k++){ var g=grpOf[outs[k]]; if(!byG[g]){byG[g]={o:[],i:[]};gl.push(g);} byG[g].o.push(outs[k]); }
    for(var k=0;k<ins.length;k++){ var g=grpOf[ins[k]]; if(!byG[g]){byG[g]={o:[],i:[]};gl.push(g);} byG[g].i.push(ins[k]); }
    var fixed=[], sets=[], mixO=[], mixI=[];
    for(var k=0;k<gl.length;k++){
      var s=byG[gl[k]];
      if(s.o.length!==s.i.length){ mixO=mixO.concat(s.o); mixI=mixI.concat(s.i); continue; }
      if(s.o.length===1) fixed.push([s.o[0],s.i[0],gl[k]]);
      else if(s.o.length>1) sets.push({grp:gl[k],outs:s.o,ins:s.i});
    }
    if(mixO.length) sets.push({grp:'ENTRE LINEAS',outs:mixO,ins:mixI,mix:true});
    for(var k=0;k<fixed.length;k++){ partner[fixed[k][0]]=fixed[k][1]; partner[fixed[k][1]]=fixed[k][0]; }
    for(var k=0;k<sets.length;k++){
      sets[k].ch=impSuggest(sets[k].outs,sets[k].ins,partner,A.tac);
      for(var o in sets[k].ch){ partner[o]=sets[k].ch[o]; partner[sets[k].ch[o]]=o; }
    }
    IMP.trans[key]={key:key,label:label,cd:cd,fixed:fixed,sets:sets,n:outs.length};
    IMP.order.push(key);
  }
  for(var q=1;q<=4;q++){
    var b=IMP.qBlock[q-1], rows=A.blocks[b];
    if(q>1){
      var pb=IMP.qBlock[q-2], prev=A.blocks[pb];
      var key='B'+pb+'>'+b;
      var lab='INICIO '+(nb===2?(b===1?'Q2/Q4':'Q3'):'Q'+q);
      mk(key,lab,0,prev[prev.length-1].on,rows[0].on);
      IMP.qKeys[q].push(key);
    }
    for(var i=1;i<rows.length;i++){
      var key2='I'+b+'_'+i;
      mk(key2,impBlkName(b,nb)+' · '+pad2(rows[i].cd)+':00',rows[i].cd,rows[i-1].on,rows[i].on);
      IMP.qKeys[q].push(key2);
    }
  }
}

function impMod(html){
  openMod(html);
  var bx=document.getElementById('mod-box'); if(bx){ bx.style.maxWidth='680px'; bx.scrollTop=0; }
}
function openImport(){
  if(MATCH.phase!=='pre') return toast('El importador solo funciona antes de iniciar el partido (usa NUEVO PARTIDO)','warn');
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv';
  inp.onchange=function(e){
    var file=e.target.files[0]; if(!file) return;
    impMod('<div class="mod-ttl">IMPORTANDO EXCEL…</div><div style="font-size:11px;color:var(--t2)">'+impEsc(file.name)+'</div>');
    var isCSV=/\.csv$/i.test(file.name);
    var rd=new FileReader();
    rd.onload=function(ev){
      var p;
      if(isCSV) p=Promise.resolve([impCSVGrid(ev.target.result)]);
      else p=impUnzip(ev.target.result).then(function(files){
        var sst=impSST(files['xl/sharedStrings.xml']), sh=impSheets(files), gs=[];
        for(var i=0;i<sh.length;i++) gs.push(impSheetGrid(sh[i],sst));
        return gs;
      });
      p.then(function(grids){
        var an=null, err=null;
        for(var i=0;i<grids.length&&!an;i++){ try{ an=impAnalyze(grids[i]); }catch(x){ if(!err) err=x; } }
        if(!an) throw err||new Error('No encuentro una hoja de cambios en el archivo');
        impStart(an,file.name);
      }).catch(function(x){
        impMod('<div class="mod-ttl" style="color:var(--r)">NO SE PUDO IMPORTAR</div>'+
          '<div style="font-size:12px;color:var(--t);margin-bottom:6px">'+impEsc(x&&x.message?x.message:String(x))+'</div>'+
          '<div class="mod-acts"><button class="btn-n" style="flex:1" onclick="closeMod()">CERRAR</button></div>');
      });
    };
    if(isCSV) rd.readAsText(file); else rd.readAsArrayBuffer(file);
  };
  inp.click();
}
function impStart(an,fname){
  IMP={an:an,file:fname,map:{},sure:{},neu:{},updPos:true,rival:an.rival||ROSTER.rival};
  for(var k=0;k<an.cols.length;k++){
    var nm=an.cols[k].name, m=impMatch(nm);
    if(m){ IMP.map[nm]=m.id; IMP.sure[nm]=m.sure; }
    else IMP.map[nm]='';
  }
  if(an.errors.length) return impShowErrors();
  impStep1();
}
function impShowErrors(){
  var h='<div class="mod-ttl" style="color:var(--r)">LA EXCEL TIENE ERRORES</div>';
  h+='<div style="font-size:10px;color:var(--t2);margin-bottom:10px">Corrige estas filas en la Excel y vuelve a importar. Ningun dato de la app se ha modificado.</div>';

  h+='<div style="font-size:9px;color:var(--t2);margin-bottom:4px">Lo que confirmes aqui se guarda como alias del jugador: la proxima vez la app lo reconocera sola.</div>';
  h+=rows;
  if(A.warns.length) for(var i=0;i<A.warns.length;i++) h+='<div style="font-size:10px;color:#b45309;margin-top:8px">&#9888; '+impEsc(A.warns[i])+'</div>';
  h+='<div class="mod-acts"><button class="btn-r" style="flex:1" onclick="impGoStep2()">SIGUIENTE</button><button class="btn-n" onclick="closeMod()">CANCELAR</button></div>';

function impGoStep2(){
  var A=IMP.an, used={};
  for(var k=0;k<A.cols.length;k++){
    var nm=A.cols[k].name, v=IMP.map[nm];
    if(!v) return toast('Falta identificar a '+nm,'warn');
    if(v==='NEW'){
      var ni=IMP.neu[nm]||{}, num=parseInt(ni.num,10);
      if(!num) return toast('Pon el dorsal de '+nm,'warn');
      for(var i=0;i<POOL.length;i++) if(POOL[i].num===num) return toast('El dorsal #'+num+' ya es de '+POOL[i].nick,'warn');
      if(used['n'+num]) return toast('Dorsal #'+num+' repetido','warn');
      used['n'+num]=1;
    } else {
      if(used[v]) return toast(gP(v).nick+' esta asignado a dos nombres','warn');
      used[v]=1;
    }
  }
  impBuildTrans();
  impStep2();

      for(var o=0;o<st.outs.length;o++){

        for(var j=0;j<st.ins.length;j++) opts+='<option value="'+impEsc(st.ins[j])+'"'+(st.ch[on]===st.ins[j]?' selected':'')+'>'+impNick(st.ins[j])+impTacTxt(st.ins[j])+'</option>';
        h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="chg-out" style="min-width:110px">'+impNick(on)+impTacTxt(on)+'</span><span class="chg-arr">&#8594;</span>'+
          '<select class="finp" style="flex:1;min-height:36px;padding:5px 8px;font-size:12px;color:var(--g);font-weight:800" data-k="'+impEsc(key)+'" data-s="'+s+'" data-o="'+impEsc(on)+'" onchange="impSetCh(this)">'+opts+'</select></div>';
      }

    }

  h+='<div class="mod-acts"><button class="btn-r" style="flex:1" onclick="impStep3()">SIGUIENTE</button><button class="btn-n" onclick="impStep1()">ATRAS</button></div>';

function impNick(nm){

function impStep3(){

  var bench=A.cols.map(function(c){return c.name;}).filter(function(n){return xi.indexOf(n)<0;});

  h+='<span class="lbl" style="margin-top:0">11 INICIAL Q1 (+ portero)</span><div style="margin-bottom:8px">';
  for(var i=0;i<xi.length;i++) h+='<span style="display:inline-block;background:var(--g);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;margin:2px">'+impNick(xi[i])+'</span>';
  h+='</div><span class="lbl" style="margin-top:4px">BANQUILLO</span><div style="margin-bottom:10px">';

  h+='</div>';
  var ro='';
  for(var i=0;i<FIH.length;i++) ro+='<option value="'+FIH[i]+'"'+(IMP.rival===FIH[i]?' selected':'')+'>'+FIH[i]+'</option>';

  h+='<div style="font-size:10px;color:var(--t2);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:6px">Se cargan los 4 cuartos por separado (Q1 a Q4) para que el motor no dependa del espejo. Podras retocar cualquier cambio en PROGRAMA.</div>';
  if(MATCH.pairs.length) h+='<div style="font-size:10px;color:var(--r);font-weight:700;margin-bottom:6px">&#9888; Se reemplazaran los '+MATCH.pairs.length+' cambios programados actualmente.</div>';
  h+='<div class="mod-acts"><button class="btn-r" style="flex:1" onclick="impApply()">IMPORTAR</button><button class="btn-n" onclick="impStep2()">ATRAS</button></div>';

function impKpi(n,l){
  return '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center"><div style="font-size:22px;font-weight:900;font-family:monospace;color:var(--t)">'+n+'</div><div style="font-size:7px;font-weight:800;letter-spacing:1px;color:var(--t2)">'+l+'</div></div>';
}
function impApply(){
  var A=IMP.an, map={}, base=Date.now(), seq=0;
  // 1. jugadores nuevos, alias, posicion y rol tactico
  for(var k=0;k<A.cols.length;k++){
    var col=A.cols[k], nm=col.name, v=IMP.map[nm], p;
    if(v==='NEW'){
      var ni=IMP.neu[nm]||{}, id=base+(seq++);
      p={id:id,num:parseInt(ni.num,10),name:(ni.name||nm).trim(),nick:nm,pos:col.pos||'MID',roles:{},alias:[]};
      POOL.push(p); ROSTER.roles[id]={}; MATCH.pos[id]={x:50,y:50};
      v=id;
    }
    p=gP(v); map[nm]=v;
    if(!p) continue;
    if(!p.alias) p.alias=[];
    if(impNorm(nm)!==impNorm(p.nick)){
      var have=false; for(var a=0;a<p.alias.length;a++) if(impNorm(p.alias[a])===impNorm(nm)) have=true;
      if(!have) p.alias.push(nm);
    }
    if(IMP.updPos&&col.pos&&col.pos!=='GK') p.pos=col.pos;
    if(A.tac[nm]) p.tac={def:A.tac[nm].def||'',at:A.tac[nm].at||''};
  }
  // 2. porteros: se conservan los convocados; si no hay, por ranking
  var gks=[], conv=ROSTER.squad.concat(ROSTER.bench);
  for(var i=0;i<conv.length;i++){ var gp=gP(conv[i]); if(gp&&gp.pos==='GK'&&gks.indexOf(gp.id)<0) gks.push(gp.id); }
  if(!gks.length){
    var all=POOL.filter(function(x){return x.pos==='GK';});
    all.sort(function(a,b){ return ((ROSTER.roles[a.id]||{}).gk||99)-((ROSTER.roles[b.id]||{}).gk||99); });
    for(var i=0;i<all.length&&i<2;i++) gks.push(all[i].id);
  }
  var gk1=gks.length?gks[0]:null, gkB=gks.slice(1);
  function ids(names){ var r=[]; for(var i=0;i<names.length;i++) r.push(map[names[i]]); return r; }
  // 3. convocatoria
  var xi=ids(A.blocks[IMP.qBlock[0]][0].on), allF=ids(A.cols.map(function(c){return c.name;}));
  ROSTER.squad=xi.concat(gk1?[gk1]:[]);
  ROSTER.bench=allF.filter(function(id){return xi.indexOf(id)<0;}).concat(gkB);
  // 4. 11 inicial de cada cuarto
  MATCH.qStart={1:null,2:null,3:null,4:null};
  for(var q=2;q<=4;q++) MATCH.qStart[q]=ids(A.blocks[IMP.qBlock[q-1]][0].on).concat(gk1?[gk1]:[]);
  // 5. cambios
  var pairs=[];
  for(var q=1;q<=4;q++){
    for(var k=0;k<IMP.qKeys[q].length;k++){
      var t=IMP.trans[IMP.qKeys[q][k]], lst=t.fixed.map(function(f){return [f[0],f[1]];});
      for(var s=0;s<t.sets.length;s++) for(var o in t.sets[s].ch) lst.push([o,t.sets[s].ch[o]]);
      for(var j=0;j<lst.length;j++) pairs.push({id:base+1000+(seq++),q:q,cd:t.cd,out:map[lst[j][0]],inp:map[lst[j][1]]});
    }
  }
  MATCH.pairs=pairs; MATCH.mirror=false; MATCH.curQ=1;
  MATCH.posDragged={};
  if(IMP.rival) ROSTER.rival=IMP.rival;
  var nPlay=pairs.filter(function(p){return p.cd>0;}).length;
  MATCH.importInfo={file:IMP.file,title:A.title||'',at:new Date().toISOString(),n:nPlay};
  IMP=null;
  doSave();
  var bx=document.getElementById('mod-box'); if(bx) bx.style.maxWidth='';
  closeMod(); rHdr(); go(1);
  toast('Excel importada: '+nPlay+' cambios programados','ok');
}

// ══════════════════════════════════════════════════
// ROSTER EXPORT / IMPORT
// ══════════════════════════════════════════════════
function exportRoster(){
  var data={
    pool:POOL,
    squad:ROSTER.squad,
    bench:ROSTER.bench,
    roles:ROSTER.roles,
    pcVars:ROSTER.pcVars,
    nextVid:ROSTER.nextVid,
    rival:ROSTER.rival,
    pairs:MATCH.pairs,
    mirror:MATCH.mirror,
    qStart:MATCH.qStart,
    importInfo:MATCH.importInfo,
    exported:new Date().toISOString().slice(0,10),
    version:'rs29'
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;
  a.download='RedSticks-Plantilla-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Plantilla exportada','ok');
}
function importRoster(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json';
  inp.onchange=function(e){
    var file=e.target.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(d.pool&&d.pool.length){
          POOL.length=0;
          for(var i=0;i<d.pool.length;i++) POOL.push(d.pool[i]);
        }
        if(d.squad) ROSTER.squad=d.squad;
        if(d.bench) ROSTER.bench=d.bench;
        if(d.roles) ROSTER.roles=d.roles;
        if(d.pcVars) ROSTER.pcVars=d.pcVars;
        if(d.nextVid) ROSTER.nextVid=d.nextVid;
        if(d.rival) ROSTER.rival=d.rival;
        if(d.pairs) MATCH.pairs=d.pairs;
        if(d.mirror!==undefined) MATCH.mirror=d.mirror;
        if(d.qStart) MATCH.qStart=d.qStart;
        if(d.importInfo!==undefined) MATCH.importInfo=d.importInfo;
        save();
        rPlantilla();
        var msg='Plantilla importada correctamente';
        if(d.pairs) msg+=' ('+d.pairs.length+' cambios programados)';
        toast(msg,'ok');
      }catch(err){
        toast('Error al importar: archivo invalido','urgent');
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ══════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════
var LS='redsticks-esp-absoluta', _st=null;
function save(){ clearTimeout(_st); _st=setTimeout(doSave,1500); }
setInterval(doSave,15000);
function doSave(){
  try{
    localStorage.setItem(LS,JSON.stringify({
      roster:{
        squad:ROSTER.squad, bench:ROSTER.bench,
        roles:ROSTER.roles, pcVars:ROSTER.pcVars,
        nextVid:ROSTER.nextVid, rival:ROSTER.rival
      },
      match:{
        pairs:MATCH.pairs, mirror:MATCH.mirror, curQ:MATCH.curQ,
        phase:MATCH.phase, qElapsed:MATCH.qElapsed,
        matchTime:MATCH.matchTime, breakCd:MATCH.breakCd,
        score:MATCH.score, qLog:MATCH.qLog, log:MATCH.log,
        execIds:MATCH.execIds, alerted:MATCH.alerted,
        events:MATCH.events, pos:MATCH.pos, posDragged:MATCH.posDragged,
        videoStartAt:MATCH.videoStartAt, qWallStart:MATCH.qWallStart, manual:MATCH.manual, qStart:MATCH.qStart, importInfo:MATCH.importInfo,
        pb:MATCH.pb, expelled:MATCH.expelled
      },
      pool:POOL
    }));
  }catch(e){console.warn('save',e);}
}
function doLoad(){
  try{
    var raw=localStorage.getItem(LS); if(!raw) return false;
    var d=JSON.parse(raw);
    if(d.pool&&d.pool.length){
      POOL.length=0;
      for(var i=0;i<d.pool.length;i++) POOL.push(d.pool[i]);
    }
    if(d.roster){
      var r=d.roster;
      if(r.squad) ROSTER.squad=r.squad;
      if(r.bench) ROSTER.bench=r.bench;
      if(r.roles) ROSTER.roles=r.roles;
      if(r.pcVars) ROSTER.pcVars=r.pcVars;
      if(r.nextVid) ROSTER.nextVid=r.nextVid;
      if(r.rival) ROSTER.rival=r.rival;
    }
    if(d.match){
      var m=d.match;
      var keys=['pairs','mirror','curQ','phase','qElapsed','matchTime','breakCd',
                'score','qLog','log','execIds','alerted','events','pos','posDragged',
                'videoStartAt','qWallStart','manual','qStart','importInfo','pb','expelled'];
      for(var i=0;i<keys.length;i++) if(m[keys[i]]!==undefined) MATCH[keys[i]]=m[keys[i]];
    }
    return true;
  }catch(e){console.warn('load',e);return false;}
}

// ── START ──
initROSTER();
doLoad();
go(0);
</script>
